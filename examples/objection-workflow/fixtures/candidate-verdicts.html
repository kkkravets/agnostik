<style>
.patronus-dot {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.patronus-dot::before {
  content: '';
  position: absolute;
  inset: -40%;
  border-radius: 50%;
  background: radial-gradient(circle, var(--patronus-glow) 0%, var(--patronus-glow-outer) 40%, transparent 70%);
  opacity: 0.4;
  animation: patronus-pulse 3s ease-in-out infinite;
}
.patronus-dot::after {
  content: '';
  position: absolute;
  inset: 15%;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, var(--patronus-highlight) 0%, var(--patronus-core) 50%, var(--patronus-glow-outer) 100%);
}
.patronus-dot.tainted::before {
  background: radial-gradient(circle, var(--patronus-taint-glow) 0%, var(--patronus-taint-outer) 40%, transparent 70%);
}
.patronus-dot.tainted::after {
  background: radial-gradient(circle at 35% 35%, var(--red) 0%, var(--patronus-taint-core) 50%, var(--patronus-taint-outer) 100%);
}
.patronus-dot.warn::before {
  background: radial-gradient(circle, var(--patronus-warn-glow) 0%, var(--patronus-warn-outer) 40%, transparent 70%);
}
.patronus-dot.warn::after {
  background: radial-gradient(circle at 35% 35%, var(--yellow) 0%, var(--patronus-warn-core) 50%, var(--patronus-warn-outer) 100%);
}
@keyframes patronus-pulse {
  0%, 100% { transform: scale(1); opacity: 0.4; }
  50% { transform: scale(1.15); opacity: 0.25; }
}
.scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
.scrollbar-none::-webkit-scrollbar { display: none; }
/* Suppress Safari long-press callout on interactive SVG pills */
.pill-node, .pill-result, .fpill-result, .graph-node { -webkit-touch-callout: none; -webkit-user-select: none; }

// ── Theme toggle ──
(function() {
  const saved = localStorage.getItem('pltg-theme');
  if (saved) document.documentElement.setAttribute('data-theme', saved);
  updateThemeIcon();
})();
function toggleTheme() {
  const html = document.documentElement;
  const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  localStorage.setItem('pltg-theme', next);
  updateThemeIcon();
  // Refresh shared palette
  refreshPalette();
  // Reset graph/layers so they re-render with new colors
  graphInitialized = false;
  layersInitialized = false;
  const gSvg = document.getElementById('graph');
  if (gSvg) gSvg.innerHTML = '';
  const gView = document.getElementById('graph-view');
  if (gView) gView.querySelectorAll('canvas').forEach(c => c.remove());
  const lSvg = document.getElementById('layers-svg');
  if (lSvg) lSvg.innerHTML = '';
  // Remove graph stats overlay if present
  const gs = document.getElementById('graph-stats');
  if (gs && gs.parentElement) gs.parentElement.remove();
  // Re-render current view
  if (typeof switchView === 'function') switchView(currentView);
}
function updateThemeIcon() {
  const icon = document.getElementById('theme-icon');
  if (icon) icon.innerHTML = document.documentElement.getAttribute('data-theme') === 'dark' ? '&#9790;' : '&#9788;';
  // Update SVG logo fill
  document.querySelectorAll('h1 svg path').forEach(p => p.setAttribute('fill', getComputedStyle(document.documentElement).getPropertyValue('--lavender').trim()));
}

function getColor(name) {
  return getComputedStyle(document.documentElement).getPropertyValue('--' + name).trim();

  C.patronusWarnCore = getColor('patronus-warn-core');
  C.patronusWarnGlow = getColor('patronus-warn-glow');
  C.patronusWarnOuter = getColor('patronus-warn-outer');
}
refreshPalette();

// ── Constants ──
const KIND_COLORS = {
  fact:'bg-green',axiom:'bg-peach',defterm:'bg-blue',theorem:'bg-mauve',
  diff:'bg-patronus',derive:'bg-mauve',evidence:'bg-overlay0','search-result':'bg-green',
  diagnostic:'bg-red',hologram:'bg-teal',document:'bg-sky',input:'bg-surface2',
  lens:'bg-lavender',unknown:'bg-surface2'
};
const KIND_TEXT = {
  fact:'text-green',axiom:'text-peach',defterm:'text-blue',theorem:'text-mauve',
  diff:'text-patronus',derive:'text-mauve',evidence:'text-overlay0','search-result':'text-green',
  diagnostic:'text-red',hologram:'text-teal',document:'text-sky',lens:'text-lavender'
};
const KIND_DOT_VAR = {
  fact:'green',axiom:'peach',defterm:'blue',theorem:'mauve',
  diff:'patronus',derive:'mauve',evidence:'overlay0','search-result':'green',
  diagnostic:'red',hologram:'teal',document:'sky',input:'surface2',
  lens:'lavender'
};

function kindColor(k) { return KIND_COLORS[k] || KIND_COLORS.unknown; }
function kindText(k) { return KIND_TEXT[k] || 'text-subtext'; }
function kindDot(k) { return getColor(KIND_DOT_VAR[k] || 'surface2'); }
function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ── State ──
let activeKinds = new Set();
let searchQuery = '';
let searchMode = 'text'; // 'text' | 'diagnostics' — the search bar is typed
let currentView = 'source';

// Parse the raw search box value into (mode, query).
// "diag:absence_violated" filters structurally by finding type/category;
// anything else is plain text search.
function parseSearch(raw) {
  if (raw.toLowerCase().startsWith('diag:')) {
    searchMode = 'diagnostics';
    searchQuery = raw.slice(5).trim().toLowerCase();
  } else {
    searchMode = 'text';
    searchQuery = raw.toLowerCase();
  }
}

function hasFinding(id, facet) {
  const findings = (typeof HEALTH_DATA !== 'undefined' && id && HEALTH_DATA[id]) || [];
  return findings.some(f => f.type.toLowerCase() === facet || f.category.toLowerCase() === facet);
}

// ── Kind discovery ──
const allKinds = [...new Set(
  DATA.map(d => d.kind || d.category || '')
    .concat(STRUCTURE_DATA.map(d => d.kind || d.category || ''))
)].filter(Boolean).sort();

// ── Filters ──
const filtersEl = document.getElementById('kind-filters');
allKinds.forEach(k => {
  const btn = document.createElement('button');
  btn.className = `px-2 py-0.5 rounded text-xs border border-surface2 ${kindText(k)} hover:bg-surface1 transition-colors`;
  btn.textContent = k;
  btn.dataset.kind = k;
  btn.onclick = () => {
    if (activeKinds.has(k)) { activeKinds.delete(k); btn.classList.remove('bg-surface1','font-bold'); btn.classList.add('bg-transparent'); }
    else { activeKinds.add(k); btn.classList.add('bg-surface1','font-bold'); btn.classList.remove('bg-transparent'); }
    render();
  };
  filtersEl.appendChild(btn);
});

// ── Search with suggestions ──
const searchEl = document.getElementById('search');
const suggestionsEl = document.getElementById('search-suggestions');

// All known node names for suggestions (lazy — ITEM_BY_ID defined later)
let _allNames = null;
function _getAllNames() {
  if (!_allNames) _allNames = Object.keys(ITEM_BY_ID);
  return _allNames;
}

function _updateSuggestions(query) {
  if (!query || query.length < 2) {
    suggestionsEl.classList.add('hidden');
    return;
  }
  let q = query.toLowerCase();
  const diagOnly = q.startsWith('diag:');
  if (diagOnly) q = q.slice(5).trim();
  // Health facets first — the search bar knows about findings
  let healthRows = '';
  if (typeof HEALTH_DATA !== 'undefined') {
    const facets = {};
    Object.values(HEALTH_DATA).forEach(fs => fs.forEach(f => {
      facets[f.type] = (facets[f.type] || 0) + 1;
      facets[f.category] = (facets[f.category] || 0) + 1;
    }));
    const facetNames = Object.keys(facets).sort()
      .filter(t => !q || t.toLowerCase().includes(q))
      .slice(0, diagOnly ? 12 : 4);
    healthRows = facetNames.map(t =>
      `<div class="search-suggestion px-3 py-1.5 cursor-pointer hover:bg-surface0 flex items-center gap-2 text-sm" data-health="${esc(t)}">
        <span class="w-2 h-2 rounded-full shrink-0 bg-red"></span>
        <span class="truncate text-red">${esc(t)}</span>
        <span class="text-xs text-overlay0">health</span>
        <span class="text-xs ml-auto shrink-0 text-subtext">&times; ${facets[t]}</span>
      </div>`
    ).join('');
  }
  // Exact prefix matches first, then substring matches (diag: shows facets only)
  const prefix = [];
  const substr = [];
  if (!diagOnly) {
    _getAllNames().forEach(name => {
      const short = name.includes('.') ? name.split('.').slice(1).join('.') : name;
      const low = name.toLowerCase();
      const slowLow = short.toLowerCase();
      if (slowLow.startsWith(q) || low.startsWith(q)) prefix.push(name);
      else if (low.includes(q) || slowLow.includes(q)) substr.push(name);
    });
  }
  const matches = prefix.concat(substr).slice(0, 12);
  if (!matches.length && !healthRows) {
    suggestionsEl.classList.add('hidden');
    return;
  }
  suggestionsEl.innerHTML = healthRows + matches.map(name => {
    const item = ITEM_BY_ID[name];
    const kind = item ? item.kind : '';
    const dotVar = KIND_DOT_VAR[kind] || 'surface2';
    const short = name.includes('.') ? name.split('.').slice(1).join('.') : name;
    const val = item && item.value ? (' = ' + esc(String(item.value).slice(0, 30))) : '';
    const nameFill = diffTextPrimary(name) || '';
    const kindFill = diffTextSecondary(name) || '';
    const valFill = diffTextMuted(name) || '';
    return `<div class="search-suggestion px-3 py-1.5 cursor-pointer hover:bg-surface0 flex items-center gap-2 text-sm" data-name="${esc(name)}">
      <span class="w-2 h-2 rounded-full shrink-0" style="background:var(--${dotVar})"></span>
      <span class="truncate" style="${nameFill ? 'color:'+nameFill : ''}">${esc(short)}</span>
      <span class="text-xs truncate" style="${kindFill ? 'color:'+kindFill : 'color:var(--overlay0)'}">${esc(kind)}</span>
      <span class="text-xs ml-auto shrink-0" style="${valFill ? 'color:'+valFill : 'color:var(--subtext)'}">${val}</span>
    </div>`;
  }).join('');
  suggestionsEl.classList.remove('hidden');
}

suggestionsEl.addEventListener('click', (e) => {
  const row = e.target.closest('.search-suggestion');
  if (!row) return;
  if (row.dataset.health) {
    searchEl.value = 'diag:' + row.dataset.health;
    parseSearch(searchEl.value);
    suggestionsEl.classList.add('hidden');
    render();
    if (currentView === 'health') renderHealth();
    return;
  }
  const name = row.dataset.name;
  searchEl.value = name;
  searchQuery = name.toLowerCase();
  suggestionsEl.classList.add('hidden');
  focusCurrentView(name);
});

// Close suggestions on outside click or Escape
document.addEventListener('click', (e) => {
  if (!e.target.closest('#search') && !e.target.closest('#search-suggestions')) {
    suggestionsEl.classList.add('hidden');
  }
});
let _sugIdx = -1;
function _highlightSug(idx) {
  const rows = suggestionsEl.querySelectorAll('.search-suggestion');
  rows.forEach((r, i) => r.classList.toggle('bg-surface0', i === idx));
  _sugIdx = idx;
  if (idx >= 0 && rows[idx]) rows[idx].scrollIntoView({ block: 'nearest' });
}
searchEl.addEventListener('keydown', (e) => {
  const rows = suggestionsEl.querySelectorAll('.search-suggestion');
  const open = !suggestionsEl.classList.contains('hidden') && rows.length > 0;
  if (e.key === 'Escape') { suggestionsEl.classList.add('hidden'); _sugIdx = -1; return; }
  if (e.key === 'ArrowDown' && open) {
    e.preventDefault();
    _highlightSug((_sugIdx + 1) % rows.length);
    return;
  }
  if (e.key === 'ArrowUp' && open) {
    e.preventDefault();
    _highlightSug((_sugIdx - 1 + rows.length) % rows.length);
    return;
  }
  if (e.key === 'Enter') {
    const target = (_sugIdx >= 0 && rows[_sugIdx]) ? rows[_sugIdx] : rows[0];
    if (target && open) {
      e.preventDefault();
      suggestionsEl.classList.add('hidden');
      _sugIdx = -1;
      if (target.dataset.health) {
        searchEl.value = 'diag:' + target.dataset.health;
        parseSearch(searchEl.value);
        render();
        if (currentView === 'health') renderHealth();
        return;
      }
      const name = target.dataset.name;
      searchEl.value = name;
      searchQuery = name.toLowerCase();
      focusCurrentView(name);
    }
  }
});

searchEl.addEventListener('input', (e) => {
  parseSearch(e.target.value);
  _sugIdx = -1;
  _updateSuggestions(e.target.value);
  render();
  if (currentView === 'health') renderHealth();
});

// ── Focus dispatch for current view ──
function focusCurrentView(name) {
  const item = ITEM_BY_ID[name];
  if (currentView === 'notebook' && window._notebookFocusNode) {
    window._notebookFocusNode(name);
  } else if (currentView === 'graph' && window._graphFocusNode) {
    window._graphFocusNode(name);
  } else if (currentView === 'layers' && window._layersFocusNode) {
    window._layersFocusNode(name);
  } else if (item) {
    showDetail(item);
  }
  render();
}

// ── View toggle ──
const VIEW_BTNS = ['source', 'structure', 'layers', 'graph', 'health'];
VIEW_BTNS.forEach(v => {
  document.getElementById('btn-' + v).onclick = () => switchView(v);
});

function switchView(v) {
  currentView = v;
  VIEW_BTNS.forEach(id => {
    document.getElementById(id + '-view').classList.toggle('hidden', v !== id);
    document.getElementById('btn-' + id).className = v === id
      ? 'px-3 py-1 rounded-lg text-xs bg-mauve text-crust font-bold'
      : 'px-3 py-1 rounded-lg text-xs bg-surface0 text-subtext hover:bg-surface1';
  });
  // Adjust full-height views to account for actual header size
  _syncViewHeight();
  if (v === 'source') renderSource();
  if (v === 'structure') render();
  if (v === 'graph') renderGraph();
  if (v === 'layers') renderLayers();
  if (v === 'health') renderHealth();
}

function _syncViewHeight() {
  const header = document.querySelector('#app > .sticky');
  if (!header) return;
  const h = header.offsetHeight;
  ['layers-view', 'graph-view'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.style.height = 'calc(100vh - ' + h + 'px)';
  });
}
window.addEventListener('resize', _syncViewHeight);

// ── Filter logic ──
function filtered(source) {
  const items = source || (currentView === 'structure' ? STRUCTURE_DATA : DATA);
  return items.filter(d => {
    const k = d.kind || d.category || '';
    if (activeKinds.size > 0 && !activeKinds.has(k)) return false;
    if (searchQuery) {
      if (searchMode === 'diagnostics') return hasFinding(d.id, searchQuery);
      const findings = (typeof HEALTH_DATA !== 'undefined' && d.id && HEALTH_DATA[d.id]) || [];
      const hay = (JSON.stringify(d) + JSON.stringify(findings)).toLowerCase();
      return hay.includes(searchQuery);
    }
    return true;
  });
}

// ── Data index for tree walks ──
const ITEM_BY_ID = {};
DATA.forEach(d => { if (d.id) ITEM_BY_ID[d.id] = d; });
STRUCTURE_DATA.forEach(d => { if (d.id) ITEM_BY_ID[d.id] = d; });

// ── Diff state map: id → 'coherent' | 'tainted' | 'warn' ──
const DIFF_STATE = {};
DATA.forEach(d => {
  if (d.kind === 'diff' && d.diff) {
    const df = d.diff;
    if (df.coherent) {
      DIFF_STATE[d.id] = (df.contaminated && Object.keys(df.contaminated).length) ? 'warn' : 'coherent';
    } else {
      DIFF_STATE[d.id] = 'tainted';
    }
  }
});

// ── State-aware text colors for diff nodes (color-mixed, not raw alert) ──
// Returns CSS color value. null for non-diffs.
function diffTextPrimary(id) {
  const st = DIFF_STATE[id];
  if (!st) return null;
  if (st === 'coherent') return 'var(--patronus-text-primary)';
  if (st === 'tainted') return 'var(--patronus-taint-core)';
  return 'var(--patronus-warn-core)';  // warn
}
function diffTextSecondary(id) {
  const st = DIFF_STATE[id];
  if (!st) return null;
  if (st === 'coherent') return 'var(--patronus-text-secondary)';
  if (st === 'tainted') return 'var(--patronus-taint-glow)';
  return 'var(--patronus-warn-glow)';  // warn
}
function diffTextMuted(id) {
  const st = DIFF_STATE[id];
  if (!st) return null;
  if (st === 'coherent') return 'var(--patronus-text-muted)';
  if (st === 'tainted') return 'var(--patronus-taint-outer)';
  return 'var(--patronus-warn-outer)';  // warn
}
function diffBorderColor(id) {
  const st = DIFF_STATE[id];
  if (!st) return null;
  if (st === 'coherent') return 'var(--patronus-line)';
  if (st === 'tainted') return 'var(--patronus-taint-outer)';
  return 'var(--patronus-warn-outer)';  // warn
}

function highlightInput(name) {
  searchEl.value = name;
  searchQuery = name.toLowerCase();
  render();
}


// ── Source View: document lines, evidence, quotes ──
let sourceInitialized = false;

function renderSource() {
  const container = document.getElementById('source-container');
  const items = filtered(DATA);
  document.getElementById('count').textContent = `${items.length} / ${DATA.length}`;
  container.innerHTML = '';

  if (FORM_TYPE === 'sr') {
    renderSrSource(container, items);
  } else if (FORM_TYPE === 'ln') {
    renderLnSource(container, items);
  } else if (FORM_TYPE === 'dx') {
    renderDxSource(container, items);
  } else if (FORM_TYPE === 'hn') {
    renderHnSource(container, items);
  }
}

function renderSrSource(container, items) {
  // Group by document
  const byDoc = {};
  items.forEach(d => {
    const doc = d.doc || '(unknown)';
    if (!byDoc[doc]) byDoc[doc] = [];
    byDoc[doc].push(d);
  });

  // Sort documents by number of matches (most first)
  const docs = Object.keys(byDoc).sort((a, b) => byDoc[b].length - byDoc[a].length);

  docs.forEach(doc => {
    const lines = byDoc[doc].sort((a, b) => (parseInt(a.line) || 0) - (parseInt(b.line) || 0));
    const section = document.createElement('div');
    section.className = 'mb-6';

    // Document header
    const header = document.createElement('div');
    header.className = 'flex items-center gap-2 mb-2 cursor-pointer select-none group';
    header.innerHTML = `
      <span class="text-xs text-overlay0 group-hover:text-text transition-colors">&#9660;</span>
      <span class="text-sm font-bold text-sky">${esc(doc)}</span>
      <span class="text-xs text-overlay0">${lines.length} matches</span>
    `;
    let collapsed = false;
    const body = document.createElement('div');
    body.className = 'bg-crust rounded-lg border border-surface1 overflow-hidden';

    header.onclick = () => {
      collapsed = !collapsed;
      body.classList.toggle('hidden', collapsed);
      header.querySelector('span').textContent = collapsed ? '\u25b6' : '\u25bc';
    };

    lines.forEach((d, i) => {
      const row = document.createElement('div');
      row.className = 'flex items-start gap-3 px-4 py-2 hover:bg-surface0/50 cursor-pointer transition-colors' +
        (i < lines.length - 1 ? ' border-b border-surface0' : '');
      row.onclick = () => showDetail(d);

      // Line number
      const lineNum = document.createElement('span');
      lineNum.className = 'text-overlay0 text-xs w-10 text-right shrink-0 select-none pt-0.5';
      lineNum.textContent = d.line;

      // Context (the actual source line)
      const ctx = document.createElement('div');
      ctx.className = 'flex-1 min-w-0';
      const codeLine = document.createElement('div');
      codeLine.className = 'text-xs text-text whitespace-pre-wrap break-all';
      codeLine.textContent = d.ctx || '';
      ctx.appendChild(codeLine);

      // Callers (pltg nodes that reference this line)
      if (d.callers && d.callers.length) {
        const callersDiv = document.createElement('div');
        callersDiv.className = 'flex flex-wrap gap-1 mt-1';
        d.callers.forEach(c => {
          const tag = document.createElement('span');
          const name = typeof c === 'object' ? c.name : c;
          const overlap = typeof c === 'object' ? c.overlap : null;
          const short = name.includes('.') ? name.split('.').slice(1).join('.') : name;
          tag.className = 'px-1.5 py-0.5 rounded text-[10px] bg-surface0 text-lavender';
          tag.textContent = short + (overlap != null ? ` ${Math.round(overlap * 100)}%` : '');
          tag.title = name;
          callersDiv.appendChild(tag);
        });
        ctx.appendChild(callersDiv);
      }

      row.appendChild(lineNum);
      row.appendChild(ctx);
      body.appendChild(row);
    });

    section.appendChild(header);
    section.appendChild(body);
    container.appendChild(section);
  });
}

function renderLnSource(container, items) {
  // Show evidence/origin quotes grouped by source document
  const withEvidence = items.filter(d => d.evidence && d.evidence.length > 0);
  if (!withEvidence.length) {
    container.innerHTML = '<div class="text-overlay0 text-sm p-4">No source evidence in current items.</div>';
    return;
  }

  // Group by evidence document
  const byDoc = {};
  withEvidence.forEach(d => {
    d.evidence.forEach(ev => {
      const doc = ev.doc || '(derived)';
      if (!byDoc[doc]) byDoc[doc] = [];
      byDoc[doc].push({ item: d, ev: ev });
    });
  });

  const docs = Object.keys(byDoc).sort();
  docs.forEach(doc => {
    const entries = byDoc[doc];
    const section = document.createElement('div');
    section.className = 'mb-6';

    const header = document.createElement('div');
    header.className = 'flex items-center gap-2 mb-2';
    header.innerHTML = `
      <span class="text-sm font-bold text-sky">${esc(doc)}</span>
      <span class="text-xs text-overlay0">${entries.length} references</span>
    `;

    const body = document.createElement('div');
    body.className = 'bg-crust rounded-lg border border-surface1 overflow-hidden';

    entries.forEach((e, i) => {
      const row = document.createElement('div');
      row.className = 'px-4 py-2' + (i < entries.length - 1 ? ' border-b border-surface0' : '');
      row.onclick = () => showDetail(e.item);
      row.style.cursor = 'pointer';

      // Node name + status
      const nameDiv = document.createElement('div');
      nameDiv.className = 'flex items-center gap-2 mb-1';
      const st = e.ev.status || (e.ev.verified ? 'verified' : 'unverified');
      const stColor = st === 'verified' ? 'text-green' : st === 'derived' ? 'text-blue' : 'text-yellow';
      const stIcon = st === 'verified' ? '\u2713' : st === 'derived' ? '\u2713' : '\u25cb';
      nameDiv.innerHTML = `
        <span class="${stColor} text-xs">${stIcon}</span>
        <span class="text-xs font-bold text-lavender">${esc(e.item.id)}</span>
        <span class="text-[10px] ${kindText(e.item.kind)}">${esc(e.item.kind)}</span>
      `;
      row.appendChild(nameDiv);

      // Quotes
      if (e.ev.quotes && e.ev.quotes.length) {
        e.ev.quotes.forEach(q => {
          const quoteDiv = document.createElement('div');
          const bc = st === 'verified' ? 'border-green' : 'border-yellow';
          quoteDiv.className = `text-xs text-subtext whitespace-pre-wrap bg-surface0 rounded p-2 mt-1 border-l-2 ${bc}`;
          quoteDiv.textContent = q;
          row.appendChild(quoteDiv);
        });
      }
      body.appendChild(row);
    });

    section.appendChild(header);
    section.appendChild(body);
    container.appendChild(section);
  });
}

function renderDxSource(container, items) {
  // Group diagnostics by category
  const byCat = {};
  items.forEach(d => {
    const cat = d.category || 'unknown';
    if (!byCat[cat]) byCat[cat] = [];
    byCat[cat].push(d);
  });

  Object.keys(byCat).sort().forEach(cat => {
    const section = document.createElement('div');
    section.className = 'mb-6';
    section.innerHTML = `<div class="flex items-center gap-2 mb-2">
      <span class="text-sm font-bold text-red">${esc(cat)}</span>
      <span class="text-xs text-overlay0">${byCat[cat].length}</span>
    </div>`;

    const body = document.createElement('div');
    body.className = 'bg-crust rounded-lg border border-surface1 overflow-hidden';
    byCat[cat].forEach((d, i) => {
      const row = document.createElement('div');
      row.className = 'px-4 py-2 cursor-pointer hover:bg-surface0/50' + (i < byCat[cat].length - 1 ? ' border-b border-surface0' : '');
      row.onclick = () => showDetail(d);
      row.innerHTML = `
        <div class="text-xs font-bold text-text">${esc(d.id)}</div>
        ${d.detail ? `<div class="text-xs text-subtext mt-1">${esc(d.detail)}</div>` : ''}
        <div class="text-[10px] text-overlay0 mt-1">${esc(d.kind)} / ${esc(d.type)}</div>
      `;
      body.appendChild(row);
    });
    section.appendChild(body);
    container.appendChild(section);
  });
}

function renderHnSource(container, items) {
  items.forEach(d => {
    const card = document.createElement('div');
    card.className = 'mb-4 bg-crust rounded-lg border border-surface1 p-4 cursor-pointer hover:border-teal/50';
    card.onclick = () => showDetail(d);

    const lenses = d.lenses || [];
    const present = lenses.filter(l => l != null);
    const diverges = present.length > 1 && present.some(l => l.value !== present[0].value || l.kind !== present[0].kind);

    let lensHtml = '';
    lenses.forEach((lens, i) => {
      lensHtml += `<div class="mt-2 pt-2 border-t border-surface0">`;
      lensHtml += `<span class="text-[10px] text-overlay0 font-bold">Lens ${i}</span>`;
      if (lens == null) {
        lensHtml += `<span class="text-[10px] text-overlay0 ml-2 italic">(absent)</span>`;
      } else {
        if (lens.kind) lensHtml += `<span class="ml-2 px-1 py-0.5 rounded text-[10px] ${kindColor(lens.kind)} text-crust">${esc(lens.kind)}</span>`;
        if (lens.value) lensHtml += `<div class="text-xs text-subtext mt-1">${esc(lens.value)}</div>`;
      }
      lensHtml += `</div>`;
    });

    card.innerHTML = `
      <div class="flex items-center gap-2 mb-1">
        <span class="text-sm font-bold text-teal">${esc(d.id)}</span>
        ${d.kind ? `<span class="px-1.5 py-0.5 rounded text-[10px] bg-teal text-crust">${esc(d.kind)}</span>` : ''}
        ${diverges ? '<span class="text-[10px] text-yellow">divergent</span>' : ''}
      </div>
      ${lensHtml}
    `;
    container.appendChild(card);
  });
}


// ── Structure render ──
function render() {
  const items = filtered(STRUCTURE_DATA);
  document.getElementById('count').textContent = `${items.length} / ${STRUCTURE_DATA.length}`;
  const container = document.getElementById('modules-container');
  container.innerHTML = '';

  // Group by module
  const groups = {};
  items.forEach(d => {
    const m = d.module || '(ungrouped)';
    if (!groups[m]) groups[m] = [];
    groups[m].push(d);
  });

  const sortedModules = Object.keys(groups).sort();
  sortedModules.forEach(mod => {
    const section = document.createElement('div');
    section.className = 'mb-6';

    const header = document.createElement('div');
    header.className = 'flex items-center gap-2 mb-2 cursor-pointer select-none group';
    header.innerHTML = `
      <span class="text-xs text-overlay0 group-hover:text-text transition-colors">&#9660;</span>
      <span class="text-sm font-bold text-lavender">${esc(mod)}</span>
      <span class="text-xs text-overlay0">${groups[mod].length}</span>
    `;
    let collapsed = false;
    const grid = document.createElement('div');
    grid.className = 'grid gap-2 grid-cols-[repeat(auto-fill,minmax(340px,1fr))]';

    header.onclick = () => {
      collapsed = !collapsed;
      grid.classList.toggle('hidden', collapsed);
      header.querySelector('span').textContent = collapsed ? '\u25b6' : '\u25bc';
    };

    groups[mod].forEach(d => {
      const card = document.createElement('div');
      const _td = (typeof TAINT_DATA !== 'undefined') ? TAINT_DATA : {sources:[], tainted:[], reasons:{}};
      const _tSrc = new Set(_td.sources);
      const _tAll = new Set(_td.tainted);
      const isTaintSource = d.id && _tSrc.has(d.id);
      const isTainted = d.id && _tAll.has(d.id);
      const _hd = (typeof HEALTH_DATA !== 'undefined') ? HEALTH_DATA : {};
      const findings = (d.id && _hd[d.id]) || [];
      const hasIssue = findings.some(f => f.category === 'issue');
      const hasWarning = findings.some(f => f.category === 'warning');
      const taintBorder = (isTaintSource || hasIssue) ? 'border-red'
        : (isTainted || hasWarning) ? 'border-yellow border-dashed' : 'border-surface1';
      card.className = `bg-surface0 border ${taintBorder} rounded-lg p-3 hover:border-mauve/50 cursor-pointer transition-colors`;
      card.onclick = () => showDetail(d);

      if (d.id) {
        const name = d.id || '';
        const short = name.includes('.') ? name.split('.').slice(1).join('.') : name;
        const kind = d.kind || '';
        const val = d.value || '';
        const hasEv = d.evidence && d.evidence.length > 0;
        const verified = hasEv && d.evidence[0].verified;
        const taintTag = isTaintSource ? '<span class="text-red">&#x2716; taint source</span>'
          : isTainted ? '<span class="text-yellow">&#x26a0; tainted</span>' : '';
        const healthTag = hasIssue ? `<span class="text-red">&#x2716; ${esc(findings.find(f => f.category === 'issue').type)}</span>`
          : hasWarning ? `<span class="text-yellow">&#x26a0; ${esc(findings.find(f => f.category === 'warning').type)}</span>` : '';

        // Diff cards get patronus dot + state-aware styling (color-mixed)
        if (kind === 'diff' && d.diff) {
          const df = d.diff;
          const contKeys = df.contaminated ? Object.keys(df.contaminated) : [];
          const dotCls = df.coherent ? (contKeys.length ? 'warn' : '') : 'tainted';
          const stIcon = df.coherent ? '&#x2713;' : '&#x2260;';
          const stLabel = df.coherent ? 'coherent' : 'divergent';
          const pri = diffTextPrimary(d.id);
          const sec = diffTextSecondary(d.id);
          const mut = diffTextMuted(d.id);
          const brd = diffBorderColor(d.id);
          card.style.borderColor = brd;
          card.innerHTML = `
            <div class="flex items-start justify-between gap-2 mb-1">
              <div class="flex items-center gap-2">
                <div class="patronus-dot w-3 h-3 ${dotCls}"></div>
                <span class="text-xs font-bold truncate" style="color:${pri}" title="${esc(name)}">${esc(short)}</span>
              </div>
              <span class="shrink-0 px-1.5 py-0.5 rounded text-[10px] font-bold ${kindColor(kind)} text-crust">${esc(kind)}</span>
            </div>
            <div class="text-xs truncate mb-1" style="color:${mut}">${esc(df.replace)} → ${esc(df['with'])}</div>
            <div class="flex items-center gap-2 text-[10px]">
              <span style="color:${sec}">${stIcon} ${stLabel}</span>
              ${d.depth > 0 ? `<span class="text-overlay0">depth ${d.depth}</span>` : ''}
              ${taintTag} ${healthTag}
            </div>
          `;
        } else {
        card.innerHTML = `
          <div class="flex items-start justify-between gap-2 mb-1">
            <span class="text-xs font-bold text-text truncate" title="${esc(name)}">${esc(short)}</span>
            <span class="shrink-0 px-1.5 py-0.5 rounded text-[10px] font-bold ${kindColor(kind)} text-crust">${esc(kind)}</span>
          </div>
          ${val ? `<div class="text-xs text-subtext truncate mb-1" title="${esc(val)}">${esc(val.length > 80 ? val.slice(0,77)+'...' : val)}</div>` : ''}
          <div class="flex items-center gap-2 text-[10px] text-overlay0">
            ${d.inputs && d.inputs.length ? `<span>&#x2190; ${d.inputs.length} inputs</span>` : ''}
            ${hasEv ? `<span class="${verified ? 'text-green' : 'text-yellow'}">${verified ? '&#x2713; verified' : '&#x25cb; unverified'}</span>` : ''}
            ${d.depth > 0 ? `<span>depth ${d.depth}</span>` : ''}
            ${taintTag} ${healthTag}
          </div>
        `;
        }
      } else if (FORM_TYPE === 'sr') {
        card.innerHTML = `
          <div class="flex items-center gap-2 mb-1">
            <span class="text-xs font-bold text-sky">${esc(d.doc)}</span>
            <span class="text-[10px] text-overlay0">:${esc(d.line)}</span>
          </div>
          <div class="text-xs text-subtext truncate">${esc(d.ctx)}</div>
          ${d.callers ? `<div class="text-[10px] text-overlay0 mt-1">${esc(d.callers)}</div>` : ''}
        `;
      } else if (FORM_TYPE === 'dx') {
        card.innerHTML = `
          <div class="flex items-start justify-between gap-2 mb-1">
            <span class="text-xs font-bold text-text truncate">${esc(d.id)}</span>
            <span class="shrink-0 px-1.5 py-0.5 rounded text-[10px] font-bold bg-red text-crust">${esc(d.category)}</span>
          </div>
          ${d.detail ? `<div class="text-xs text-subtext">${esc(d.detail)}</div>` : ''}
          <div class="text-[10px] text-overlay0">${esc(d.kind)} / ${esc(d.type)}</div>
        `;
      } else if (FORM_TYPE === 'hn') {
        const present = (d.lenses || []).filter(l => l != null);
        const total = (d.lenses || []).length;
        const diverges = present.length > 1 && present.some(l => l.value !== present[0].value || l.kind !== present[0].kind);
        card.innerHTML = `
          <div class="flex items-start justify-between gap-2 mb-1">
            <span class="text-xs font-bold text-teal">${esc(d.id)}</span>
            ${d.kind ? `<span class="shrink-0 px-1.5 py-0.5 rounded text-[10px] font-bold bg-teal text-crust">${esc(d.kind)}</span>` : ''}
          </div>
          <div class="flex items-center gap-2 text-[10px] text-overlay0">
            <span>${present.length}/${total} lenses</span>
            ${diverges ? '<span class="text-yellow">divergent</span>' : '<span class="text-green">same</span>'}
          </div>
          ${present.length === 1 && present[0].value ? `<div class="text-xs text-subtext truncate">${esc(present[0].value)}</div>` : ''}
        `;
      }
      grid.appendChild(card);
    });

    section.appendChild(header);
    section.appendChild(grid);
    container.appendChild(section);
  });
}


// ── Derivation tree builder ──
function buildDerivationTree(rootId, maxDepth) {
  maxDepth = maxDepth || 20;
  const visited = new Set();
  function walk(id, depth) {
    const node = ITEM_BY_ID[id];
    const entry = {
      id: id,
      kind: node ? node.kind : '?',
      value: node ? node.value : '',
      depth: node ? node.depth : -1,
      children: [],
      cycle: false,
      external: !node,
      outsideFocus: node ? !!node.external : !node
    };
    if (visited.has(id) || depth >= maxDepth) {
      entry.cycle = visited.has(id);
      return entry;
    }
    visited.add(id);
    if (node && node.inputs) {
      node.inputs.forEach(inp => {
        const inpName = typeof inp === 'string' ? inp : inp.name;
        entry.children.push(walk(inpName, depth + 1));
      });
    }
    return entry;
  }
  return walk(rootId, 0);
}

function renderTree(tree) {
  // Render as nested HTML tree with connectors
  function renderNode(node, isLast, prefix) {
    const connector = prefix === '' ? '' : (isLast ? '&#x2514;&#x2500;&#x2500; ' : '&#x251c;&#x2500;&#x2500; ');
    const kindCls = kindText(node.kind);
    const badge = `<span class="px-1 py-0.5 rounded text-[9px] ${kindColor(node.kind)} text-crust">${esc(node.kind)}</span>`;
    const short = node.id.includes('.') ? node.id.split('.').slice(1).join('.') : node.id;
    const nameSpan = node.external
      ? `<span class="text-overlay0 italic">${esc(short)}</span>`
      : node.outsideFocus
        ? `<span class="text-subtext cursor-pointer hover:text-mauve" onclick="showDetail(ITEM_BY_ID['${node.id.replace(/'/g, "\\'")}'])">${esc(short)}</span>`
        : `<span class="text-text font-bold cursor-pointer hover:text-mauve" onclick="showDetail(ITEM_BY_ID['${node.id.replace(/'/g, "\\'")}'])">${esc(short)}</span>`;
    const valSnip = node.value ? `<span class="text-subtext ml-1 text-[9px]">= ${esc(String(node.value).slice(0, 40))}</span>` : '';
    const layerTag = node.depth >= 0 ? `<span class="text-[9px] text-overlay0 ml-1">L${node.depth}</span>` : '';
    const cycleTag = node.cycle ? ' <span class="text-yellow text-[9px]">&#x21bb; cycle</span>' : '';

    let html = `<div class="flex items-center gap-1 py-0.5">`;
    html += `<span class="text-surface2 whitespace-pre font-mono text-[10px]">${prefix}${connector}</span>`;
    html += `${nameSpan} ${badge}${valSnip}${layerTag}${cycleTag}`;
    html += `</div>`;

    if (node.children.length > 0 && !node.cycle) {
      const childPrefix = prefix === '' ? '' : (prefix + (isLast ? '&nbsp;&nbsp;&nbsp;&nbsp;' : '&#x2502;&nbsp;&nbsp;&nbsp;'));
      node.children.forEach((child, i) => {
        html += renderNode(child, i === node.children.length - 1, childPrefix || '');
      });
    }
    return html;
  }
  return renderNode(tree, true, '');
}

// ── Detail panel ──
const panel = document.getElementById('detail-panel');
const appEl = document.getElementById('app');
document.getElementById('detail-close').onclick = () => {
  panel.classList.add('translate-x-full');
  appEl.classList.remove('detail-open');
  setTimeout(_syncViewHeight, 220);
};

function _itemType(d) {
  // Detect item type from properties, not FORM_TYPE
  if (d.doc && d.callers !== undefined) return 'sr';
  if (d.category && d.type !== undefined) return 'dx';
  if (d.lenses !== undefined) return 'hn';
  if (d.id) return 'ln';
  return FORM_TYPE;
}

function showDetail(d) {
  if (!d) return;
  panel.classList.remove('translate-x-full');
  appEl.classList.add('detail-open');
  setTimeout(_syncViewHeight, 220);
  document.getElementById('detail-title').textContent = d.id || d.doc || '';
  const body = document.getElementById('detail-body');
  let html = '';
  const itemType = _itemType(d);

  if (itemType === 'ln') {
    html += `<div class="space-y-3">`;
    if (d.external) {
      html += `<div class="bg-surface0 border border-surface2 rounded px-2 py-1 text-[10px] text-overlay0 mb-2">Outside current focus &mdash; data from probe graph</div>`;
    }
    html += `<div><span class="text-overlay0">name:</span> <span class="text-text font-bold">${esc(d.id)}</span></div>`;
    html += `<div><span class="text-overlay0">kind:</span> <span class="${kindText(d.kind)} font-bold">${esc(d.kind)}</span></div>`;
    // ── Diff-specific rendering (color-mixed patronus palette) ──
    if (d.kind === 'diff' && d.diff) {
      const df = d.diff;
      const contKeys = df.contaminated ? Object.keys(df.contaminated) : [];
      const hasContOnly = df.coherent && contKeys.length > 0;
      const pri = diffTextPrimary(d.id);
      const sec = diffTextSecondary(d.id);
      const mut = diffTextMuted(d.id);
      const brd = diffBorderColor(d.id);
      let icon, stLabel;
      if (df.coherent && !hasContOnly) {
        icon = '&#x2713;'; stLabel = 'Coherent';
      } else if (hasContOnly) {
        icon = '&#x26a0;'; stLabel = 'Coherent (contaminated)';
      } else {
        icon = '&#x2260;'; stLabel = 'Divergent';
      }
      html += `<div class="mt-1 flex items-center gap-2"><span class="font-bold" style="color:${pri}">${icon} ${stLabel}</span></div>`;
      html += `<div class="mt-2 rounded-lg p-3 space-y-2" style="background:var(--crust);border:1px solid ${brd}">`;
      // Branch A (replace)
      html += `<div class="flex items-center gap-2">`;
      html += `<span class="text-[10px] w-14 shrink-0" style="color:${mut}">replace</span>`;
      html += `<span class="font-bold cursor-pointer hover:text-mauve" style="color:${pri}" onclick="showDetail(ITEM_BY_ID['${(df.replace||'').replace(/'/g, "\\'")}'])">${esc(df.replace)}</span>`;
      if (df.value_a != null) html += `<span class="text-xs" style="color:${sec}">= ${esc(df.value_a)}</span>`;
      html += `</div>`;
      // Branch B (with)
      html += `<div class="flex items-center gap-2">`;
      html += `<span class="text-[10px] w-14 shrink-0" style="color:${mut}">with</span>`;
      html += `<span class="font-bold cursor-pointer hover:text-mauve" style="color:${pri}" onclick="showDetail(ITEM_BY_ID['${(df['with']||'').replace(/'/g, "\\'")}'])">${esc(df['with'])}</span>`;
      if (df.value_b != null) html += `<span class="text-xs" style="color:${sec}">= ${esc(df.value_b)}</span>`;
      html += `</div>`;
      // Divergences — downstream terms that change under substitution
      if (df.divergences) {
        const divKeys = Object.keys(df.divergences);
        if (divKeys.length) {
          html += `<div class="border-t pt-2 mt-2" style="border-color:${brd}">`;
          html += `<div class="text-[10px] font-bold mb-1" style="color:${pri}">Downstream divergences (${divKeys.length})</div>`;
          divKeys.forEach(k => {
            const dv = df.divergences[k];
            const nameSpan = ITEM_BY_ID[k]
              ? `<span class="text-text font-bold cursor-pointer hover:text-mauve" onclick="showDetail(ITEM_BY_ID['${k.replace(/'/g, "\\'")}'])">${esc(k)}</span>`
              : `<span class="text-text">${esc(k)}</span>`;
            if (dv && dv.before !== undefined) {
              html += `<div class="text-xs mt-1">${nameSpan}</div>`;
              html += `<div class="text-[10px] ml-3 text-subtext">${esc(dv.before)} <span style="color:${pri}">&rarr;</span> ${esc(dv.after)}</div>`;
            } else {
              html += `<div class="text-xs mt-1">${nameSpan}: <span style="color:${pri}">${esc(String(dv))}</span></div>`;
            }
          });
          html += `</div>`;
        } else if (df.coherent) {
          html += `<div class="border-t pt-2 mt-2" style="border-color:${brd}">`;
          html += `<div class="text-[10px]" style="color:${sec}">&#x2713; No downstream divergences</div>`;
          html += `</div>`;
        }
      }
      // Contaminated — other diffs reference the same replace side (warning, not failure)
      if (df.contaminated) {
        const contKeys = Object.keys(df.contaminated);
        if (contKeys.length) {
          html += `<div class="border-t pt-2 mt-2" style="border-color:${brd}">`;
          html += `<div class="text-[10px] font-bold mb-1" style="color:${pri}">Contaminated diffs (${contKeys.length})</div>`;
          html += `<div class="text-[10px] mb-1" style="color:${mut}">Other diffs reference the same replace side — not a real value divergence.</div>`;
          contKeys.forEach(k => {
            const cv = df.contaminated[k];
            const nameSpan = ITEM_BY_ID[k]
              ? `<span class="text-text font-bold cursor-pointer hover:text-mauve" onclick="showDetail(ITEM_BY_ID['${k.replace(/'/g, "\\'")}'])">${esc(k)}</span>`
              : `<span class="text-text">${esc(k)}</span>`;
            html += `<div class="text-xs mt-1">${nameSpan}</div>`;
            html += `<div class="text-[10px] ml-3" style="color:${mut}">${esc(cv.before)}</div>`;
          });
          html += `</div>`;
        }
      }
      html += `</div>`;
    } else {
      const noVal = !d.value || d.value === '()' || d.value === "''" || d.value === '""' || d.value === "''";
      const displayVal = noVal ? 'No value' : d.value;
      html += `<div><span class="text-overlay0">value:</span><div class="mt-1 bg-surface0 rounded p-2 text-xs whitespace-pre-wrap ${noVal ? 'text-overlay0 italic' : ''}">${esc(displayVal)}</div></div>`;
    }
    if (d.depth > 0) html += `<div><span class="text-overlay0">depth:</span> ${d.depth}</div>`;

    // ── Focus actions ──
    html += `<div class="flex gap-2 pt-1">`;
    html += `<button class="px-2 py-1 rounded text-[10px] bg-surface0 text-subtext hover:bg-surface1 hover:text-mauve border border-surface2" onclick="focusInLayers('${d.id.replace(/'/g, "\\'")}')">Focus in Layers</button>`;
    html += `<button class="px-2 py-1 rounded text-[10px] bg-surface0 text-subtext hover:bg-surface1 hover:text-mauve border border-surface2" onclick="focusInGraph('${d.id.replace(/'/g, "\\'")}')">Focus in Graph</button>`;
    html += `</div>`;

    // ── Definition (WFF) ──
    if (d.definition) {
      html += `<div class="border-t border-surface2 pt-3"><span class="text-overlay0 font-bold">Definition</span>`;
      html += `<div class="mt-1 bg-crust rounded-lg p-3 text-xs whitespace-pre-wrap font-mono text-lavender">${esc(d.definition)}</div>`;
      html += `</div>`;
    }

    // ── Evidence with quotes ──
    if (d.evidence && d.evidence.length) {
      html += `<div class="border-t border-surface2 pt-3"><span class="text-overlay0 font-bold">Evidence</span>`;
      d.evidence.forEach(ev => {
        const st = ev.status || (ev.verified ? 'verified' : 'unverified');
        if (st === 'derived') {
          html += `<div class="mt-2 text-xs text-blue">&#x2713; derived (proven by derivation)</div>`;
          return;
        }
        html += `<div class="mt-2 bg-crust rounded-lg p-3 space-y-1">`;
        if (ev.doc) html += `<div class="text-xs"><span class="text-overlay0">doc:</span> <span class="text-sky">${esc(ev.doc)}</span></div>`;
        if (ev.quotes && ev.quotes.length) {
          const ctxs = ev.quote_contexts || {};
          const details = ev.quote_details || {};
          ev.quotes.forEach(q => {
            const bc = st === 'verified' ? 'border-green' : 'border-yellow';
            const det = details[q];
            const matches = det && det.all_matches && det.all_matches.length > 1 ? det.all_matches : null;
            html += `<div class="text-xs bg-surface0 rounded p-2 mt-1 whitespace-pre-wrap border-l-2 ${bc}">`;
            if (matches) {
              // Multiple matches — same block, separated by ...
              matches.forEach((m, i) => {
                if (i > 0) html += `<div class="text-overlay0 text-center my-1">&#x2026;</div>`;
                const mctx = m.context;
                const isCurrent = m.original_line === (det.line || -1);
                const tag = isCurrent ? '&#x25c6;' : '&#x25cb;';
                const tagCls = isCurrent ? 'text-sky' : 'text-overlay0';
                html += `<div class="flex gap-2"><span class="text-[9px] text-sky">L${m.original_line}</span><span class="text-[9px] text-overlay0">${esc(m.strategy)}</span><span class="text-[9px] ${tagCls}">${tag}</span></div>`;
                if (mctx && (mctx.before || mctx.after)) {
                  if (mctx.before) html += `<span class="text-overlay0">${esc(mctx.before)}</span>`;
                  html += `<span class="font-bold text-text bg-highlight rounded-sm px-0.5">${esc(q)}</span>`;
                  if (mctx.after) html += `<span class="text-overlay0">${esc(mctx.after)}</span>`;
                } else {
                  html += `<span class="font-bold text-text">${esc(q)}</span>`;
                }
              });
            } else {
              // Single match
              const ctx = ctxs[q];
              const lineBadge = det && det.line ? `<span class="text-[9px] text-sky">L${det.line}</span>` : '';
              const confBadge = det && det.confidence != null ? `<span class="text-[9px] text-overlay0">${Math.round(det.confidence * 100)}%</span>` : '';
              if (lineBadge || confBadge) html += `<div class="flex gap-2">${lineBadge}${confBadge}</div>`;
              if (ctx && (ctx.before || ctx.after)) {
                if (ctx.before) html += `<span class="text-overlay0">${esc(ctx.before)}</span>`;
                html += `<span class="font-bold text-text bg-highlight rounded-sm px-0.5">${esc(q)}</span>`;
                if (ctx.after) html += `<span class="text-overlay0">${esc(ctx.after)}</span>`;
              } else {
                html += `<span class="font-bold text-text">${esc(q)}</span>`;
              }
            }
            html += `</div>`;
          });
        } else if (ev.quote) {
          const bc = st === 'verified' ? 'border-green' : 'border-yellow';
          html += `<div class="text-xs bg-surface0 rounded p-2 mt-1 whitespace-pre-wrap border-l-2 ${bc}">${esc(ev.quote)}</div>`;
        }
        if (ev.explanation) html += `<div class="text-xs text-subtext mt-1">${esc(ev.explanation)}</div>`;
        if (ev.label) html += `<div class="text-xs text-subtext mt-1">${esc(ev.label)}</div>`;
        const stColor = st === 'verified' ? 'text-green' : st === 'manual' ? 'text-peach' : 'text-yellow';
        const stIcon = st === 'verified' ? '&#x2713;' : st === 'manual' ? '&#x270e;' : '&#x25cb;';
        html += `<div class="text-[10px] ${stColor}">${stIcon} ${st}</div>`;
        html += `</div>`;
      });
      html += `</div>`;
    }

    // ── Health (screen findings for this node) ──
    {
      const _hd = (typeof HEALTH_DATA !== 'undefined') ? HEALTH_DATA : {};
      const findings = _hd[d.id] || [];
      if (findings.length) {
        html += `<div class="border-t border-surface2 pt-3"><span class="text-overlay0 font-bold">Health</span>`;
        html += `<div class="mt-1 bg-crust rounded-lg p-3 text-xs space-y-2">`;
        findings.forEach(f => {
          const color = f.category === 'issue' ? 'text-red' : f.category === 'warning' ? 'text-yellow' : 'text-overlay0';
          const icon = f.category === 'issue' ? '&#x2716;' : f.category === 'warning' ? '&#x26a0;' : '&#x2699;';
          html += `<div><div class="${color} font-bold">${icon} ${esc(f.type)}</div>`;
          if (f.detail) html += `<div class="text-subtext mt-0.5">${esc(f.detail)}</div>`;
          html += `</div>`;
        });
        html += `</div></div>`;
      }
    }

    // ── Taint status ──
    {
      const _td = (typeof TAINT_DATA !== 'undefined') ? TAINT_DATA : {sources:[], tainted:[], reasons:{}};
      const _tSrc = new Set(_td.sources);
      const _tAll = new Set(_td.tainted);
      if (_tAll.has(d.id)) {
        const isSource = _tSrc.has(d.id);
        const reason = (_td.reasons || {})[d.id] || (isSource ? 'taint source' : 'tainted');
        html += `<div class="border-t border-surface2 pt-3"><span class="text-overlay0 font-bold">Taint</span>`;
        html += `<div class="mt-1 bg-crust rounded-lg p-3 text-xs">`;
        html += `<div class="${isSource ? 'text-red' : 'text-yellow'} font-bold">${isSource ? '&#x2716; Taint source' : '&#x26a0; Tainted'}</div>`;
        html += `<div class="text-subtext mt-1">${esc(reason)}</div>`;
        html += `</div></div>`;
      }
    }

    // ── Derivation tree (last) ──
    if (d.inputs && d.inputs.length) {
      const tree = buildDerivationTree(d.id, 15);
      html += `<div class="border-t border-surface2 pt-3">`;
      html += `<div class="text-overlay0 font-bold mb-2">Derivation path</div>`;
      html += `<div class="bg-crust rounded-lg p-3 text-xs overflow-x-auto">${renderTree(tree)}</div>`;
      html += `</div>`;
    }
    html += `</div>`;
  } else if (itemType === 'sr') {
    html += `<div class="space-y-2">`;
    html += `<div><span class="text-overlay0">document:</span> <span class="text-sky font-bold">${esc(d.doc)}</span></div>`;
    html += `<div><span class="text-overlay0">line:</span> ${esc(String(d.line))}</div>`;
    if (d.ctx) html += `<div class="bg-surface0 rounded p-2 text-xs whitespace-pre-wrap">${esc(d.ctx)}</div>`;
    if (d.callers && d.callers.length) {
      html += `<div class="border-t border-surface2 pt-2"><span class="text-overlay0 font-bold">Callers (${d.callers.length})</span>`;
      d.callers.forEach(c => {
        const name = typeof c === 'object' ? c.name : c;
        const overlap = typeof c === 'object' ? c.overlap : null;
        const short = name.includes('.') ? name.split('.').slice(1).join('.') : name;
        const structItem = ITEM_BY_ID[name];
        const kindBadge = structItem ? `<span class="px-1 py-0.5 rounded text-[9px] ${kindColor(structItem.kind)} text-crust">${esc(structItem.kind)}</span>` : '';
        html += `<div class="flex items-center gap-2 mt-1 cursor-pointer hover:bg-surface0 rounded px-1 py-0.5" onclick="showDetail(ITEM_BY_ID['${name.replace(/'/g, "\\'")}'] || {doc:'${esc(d.doc)}',line:'${esc(String(d.line))}',ctx:'${esc(name)}',callers:[]})">`;
        html += `<span class="text-xs text-lavender font-bold">${esc(short)}</span> ${kindBadge}`;
        if (overlap != null) html += `<span class="text-[10px] text-overlay0">${Math.round(overlap * 100)}% overlap</span>`;
        html += `</div>`;
      });
      html += `</div>`;
    }
    html += `</div>`;
  } else if (itemType === 'dx') {
    html += `<div class="space-y-2">`;
    html += `<div><span class="text-overlay0">name:</span> <span class="font-bold">${esc(d.id)}</span></div>`;
    html += `<div><span class="text-overlay0">category:</span> <span class="text-red">${esc(d.category)}</span></div>`;
    html += `<div><span class="text-overlay0">kind:</span> ${esc(d.kind)}</div>`;
    html += `<div><span class="text-overlay0">type:</span> ${esc(d.type)}</div>`;
    if (d.detail) html += `<div class="bg-surface0 rounded p-2 text-xs whitespace-pre-wrap">${esc(d.detail)}</div>`;
    html += `</div>`;
  } else if (itemType === 'hn') {
    html += `<div class="space-y-3">`;
    html += `<div><span class="text-overlay0">name:</span> <span class="text-teal font-bold">${esc(d.id)}</span></div>`;
    if (d.kind) html += `<div><span class="text-overlay0">kind:</span> <span class="${kindText(d.kind)} font-bold">${esc(d.kind)}</span></div>`;
    if (d.lenses && d.lenses.length) {
      d.lenses.forEach((lens, i) => {
        html += `<div class="border-t border-surface2 pt-2">`;
        html += `<div class="text-[10px] text-overlay0 font-bold mb-1">Lens ${i}</div>`;
        if (lens == null) {
          html += `<div class="text-xs text-overlay0 italic">(absent)</div>`;
        } else {
          if (lens.kind) html += `<div class="text-xs"><span class="text-overlay0">kind:</span> <span class="${kindText(lens.kind)}">${esc(lens.kind)}</span></div>`;
          if (lens.value) html += `<div class="text-xs"><span class="text-overlay0">value:</span> ${esc(lens.value)}</div>`;
          if (lens.depth > 0) html += `<div class="text-xs"><span class="text-overlay0">depth:</span> ${lens.depth}</div>`;
          if (lens.inputs && lens.inputs.length) {
            html += `<div class="text-xs"><span class="text-overlay0">inputs:</span> ${lens.inputs.map(inp => esc(inp)).join(', ')}</div>`;
          }
        }
        html += `</div>`;
      });
    }
    html += `</div>`;
  }
  body.innerHTML = html;
}


// ── Health view — full-page diagnostics over the page's side-car data ──
// A first-class view (peer of Source/Structure/Layers/Graph), driven by
// the global search bar. Reads HEALTH_DATA / COVERAGE_DATA / TAINT_DATA
// shipped with the page; no server round-trip.

function renderHealth() {
  const root = document.getElementById('health-root');
  if (!root) return;
  const hd = (typeof HEALTH_DATA !== 'undefined') ? HEALTH_DATA : {};
  const covAll = (typeof COVERAGE_DATA !== 'undefined') ? COVERAGE_DATA : [];
  const td = (typeof TAINT_DATA !== 'undefined') ? TAINT_DATA : {sources: [], tainted: [], reasons: {}};

  const allRows = [];
  Object.keys(hd).forEach(name => hd[name].forEach(f => allRows.push({name, ...f})));

  // Global search drives the view — same typed query as every other view.
  const q = (typeof searchQuery !== 'undefined') ? searchQuery : '';
  const diag = (typeof searchMode !== 'undefined') && searchMode === 'diagnostics';
  const rows = allRows.filter(r => {
    if (!q) return true;
    if (diag) return r.type.toLowerCase() === q || r.category.toLowerCase() === q;
    return `${r.name} ${r.category} ${r.type} ${r.detail || ''}`.toLowerCase().includes(q);
  });
  // Diagnostics queries are about findings — coverage stays unfiltered there.
  const cov = (diag || !q) ? covAll : covAll.filter(c => `${c.type} ${c.document || ''} ${c.text}`.toLowerCase().includes(q));

  const issues = rows.filter(r => r.category === 'issue');
  const warnings = rows.filter(r => r.category === 'warning');
  const loader = rows.filter(r => r.category === 'loader');
  const allIssues = allRows.filter(r => r.category === 'issue').length;
  const allLoader = allRows.filter(r => r.category === 'loader').length;
  const ok = allIssues === 0 && allLoader === 0;

  // Documents assembled from typed coverage rows.
  const docs = {};
  cov.forEach(c => {
    const key = c.document || `(${c.type})`;
    (docs[key] = docs[key] || []).push(c);
  });
  const quoteRows = covAll.filter(c => c.type === 'quote_range' && typeof c.fraction === 'number');
  const avgQuoted = quoteRows.length ? quoteRows.reduce((a, c) => a + c.fraction, 0) / quoteRows.length : null;

  let html = '';

  // ── Verdict banner — over ALL findings, never the filtered view ──
  html += `<div class="rounded-xl p-4 mb-4 font-bold ${ok ? 'bg-green/10 text-green' : 'bg-red/10 text-red'}">`;
  html += ok ? '&#x2713; Consistent' : `&#x2716; Inconsistent — ${allIssues} issue(s), ${allLoader} loader error(s)`;
  if (q) html += `<span class="ml-3 text-xs font-normal text-overlay0">filtered by "${esc(q)}" — ${rows.length}/${allRows.length} findings, ${cov.length}/${covAll.length} coverage rows</span>`;
  html += `</div>`;

  // ── Stat tiles ──
  const tile = (label, value, color) =>
    `<div class="bg-surface0 rounded-xl p-4"><div class="text-2xl font-bold ${color}">${value}</div><div class="text-xs text-overlay0 mt-1">${label}</div></div>`;
  html += `<div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3 mb-4">`;
  html += tile('issues', allIssues, allIssues ? 'text-red' : 'text-green');
  html += tile('warnings', allRows.filter(r => r.category === 'warning').length, 'text-yellow');
  html += tile('loader errors', allLoader, allLoader ? 'text-red' : 'text-subtext');
  html += tile('taint sources', (td.sources || []).length, (td.sources || []).length ? 'text-red' : 'text-subtext');
  html += tile('tainted nodes', (td.tainted || []).length, (td.tainted || []).length ? 'text-yellow' : 'text-subtext');
  html += tile('documents', quoteRows.length, 'text-sky');
  html += `</div>`;

  // ── Coverage chart — quote coverage by document (magnitude → h-bars) ──
  if (quoteRows.length) {
    const claimsByDoc = {};
    covAll.forEach(c => {
      if (c.type === 'corpus_claim' && c.document) claimsByDoc[c.document] = c;
    });
    const sortedDocs = [...quoteRows].sort((a, b) => b.fraction - a.fraction);
    html += `<div class="bg-surface0 rounded-xl p-4 mb-4">`;
    html += `<div class="flex items-baseline justify-between mb-3">`;
    html += `<h3 class="text-xs font-bold text-overlay0">QUOTE COVERAGE BY DOCUMENT</h3>`;
    html += `<div><span class="text-2xl font-bold text-text">${Math.round((avgQuoted || 0) * 100)}%</span>`;
    html += `<span class="text-xs text-overlay0 ml-1">average</span></div></div>`;
    html += `<div class="space-y-1.5">`;
    sortedDocs.forEach(c => {
      const pct = Math.round(c.fraction * 100);
      const claim = claimsByDoc[c.document];
      html += `<div class="flex items-center gap-3 group rounded hover:bg-surface1 px-1 py-0.5" `;
      html += `title="${esc(c.text)}${claim ? ' — quantified by ' + esc(claim.claims ? claim.claims.join(', ') : claim.text) : ''}">`;
      html += `<span class="w-44 shrink-0 text-[11px] text-subtext truncate text-right">${esc(c.document)}</span>`;
      html += `<div class="flex-1 h-2 bg-crust rounded-[4px] overflow-hidden">`;
      html += `<div class="h-full rounded-r-[4px]" style="width:${Math.max(pct, 0.5)}%;background:var(--sky)"></div></div>`;
      html += `<span class="w-9 shrink-0 text-[11px] text-subtext tabular-nums">${pct}%</span>`;
      html += `<span class="w-16 shrink-0 text-[10px] ${claim ? 'text-mauve' : 'text-surface2'}">${claim ? '&#x2200; ' + (claim.claims ? claim.claims.length : 1) + ' claim' + ((claim.claims && claim.claims.length > 1) ? 's' : '') : ''}</span>`;
      html += `</div>`;
    });
    html += `</div>`;
    html += `<div class="text-[10px] text-overlay0 mt-2">bar = share of the document covered by verified quotes &middot; &#x2200; = document also under grounded corpus claims</div>`;
    html += `</div>`;
  }

  // ── Counts by finding type — click feeds the global search ──
  const byType = {};
  allRows.forEach(r => { byType[r.type] = (byType[r.type] || 0) + 1; });
  if (Object.keys(byType).length) {
    html += `<div class="flex flex-wrap gap-2 mb-6 text-[11px]">`;
    Object.keys(byType).sort().forEach(t => {
      const active = diag && q === t.toLowerCase();
      html += `<button data-htype="${esc(t)}" class="px-2 py-1 rounded-lg border ${active ? 'border-mauve text-mauve font-bold' : 'border-surface2 text-subtext hover:bg-surface1'}">${esc(t)} &times; ${byType[t]}</button>`;
    });
    html += `</div>`;
  }

  // ── Two columns: nodes | documents ──
  html += `<div class="grid grid-cols-1 lg:grid-cols-2 gap-6">`;

  // Nodes column
  html += `<div><h3 class="text-sm font-bold text-lavender mb-2">Nodes</h3><div class="space-y-4">`;
  const section = (label, items, color, icon) => {
    if (!items.length) return;
    html += `<div><div class="text-overlay0 font-bold text-xs mb-1">${label} (${items.length})</div><div class="space-y-1">`;
    items.forEach(r => {
      const clickable = typeof ITEM_BY_ID !== 'undefined' && ITEM_BY_ID[r.name];
      html += `<div class="bg-surface0 rounded-lg p-3 text-xs ${clickable ? 'cursor-pointer hover:bg-surface1' : ''}"`;
      if (clickable) html += ` onclick="showDetail(ITEM_BY_ID['${r.name.replace(/'/g, "\\'")}'])"`;
      html += `><span class="${color} font-bold">${icon} ${esc(r.name)}</span>`;
      html += ` <span class="text-overlay0">${esc(r.type)}</span>`;
      if (r.detail) html += `<div class="text-subtext mt-1">${esc(r.detail)}</div>`;
      html += `</div>`;
    });
    html += `</div></div>`;
  };
  section('Issues', issues, 'text-red', '&#x2716;');
  section('Warnings', warnings, 'text-yellow', '&#x26a0;');
  section('Loader', loader, 'text-overlay0', '&#x2699;');
  if ((td.sources || []).length || (td.tainted || []).length) {
    html += `<div><div class="text-overlay0 font-bold text-xs mb-1">Taint</div>`;
    html += `<div class="bg-surface0 rounded-lg p-3 text-xs text-subtext">${(td.sources || []).length} source(s) &rarr; ${(td.tainted || []).length} tainted node(s)`;
    (td.sources || []).slice(0, 10).forEach(nm => {
      html += `<div class="text-red mt-1">&#x2716; ${esc(nm)}${(td.reasons || {})[nm] ? ` <span class="text-overlay0">${esc(td.reasons[nm])}</span>` : ''}</div>`;
    });
    html += `</div></div>`;
  }
  if (!rows.length) html += `<div class="text-xs text-overlay0">${q ? 'No findings match the search.' : 'No findings — all clear.'}</div>`;
  html += `</div></div>`;

  // Documents column
  html += `<div><h3 class="text-sm font-bold text-lavender mb-2">Documents</h3><div class="space-y-2">`;
  Object.keys(docs).sort().forEach(doc => {
    html += `<div class="bg-surface0 rounded-lg p-3 text-xs">`;
    html += `<div class="font-bold text-sky mb-1">${esc(doc)}</div>`;
    docs[doc].forEach(c => {
      if (c.type === 'quote_range' && typeof c.fraction === 'number') {
        const pct = Math.round(c.fraction * 100);
        html += `<div class="flex items-center gap-2 mt-1" title="${esc(c.text)}">`;
        html += `<div class="flex-1 h-1.5 bg-crust rounded-[4px] overflow-hidden"><div class="h-full rounded-r-[4px]" style="width:${Math.max(pct, 0.5)}%;background:var(--sky)"></div></div>`;
        html += `<span class="text-subtext shrink-0 tabular-nums">${pct}% quoted</span></div>`;
      } else if (c.type === 'corpus_claim' && Array.isArray(c.claims)) {
        html += `<div class="flex flex-wrap gap-1 mt-1.5">`;
        c.claims.forEach(nm => {
          const clickable = typeof ITEM_BY_ID !== 'undefined' && ITEM_BY_ID[nm];
          html += `<button class="px-1.5 py-0.5 rounded border border-mauve/40 text-mauve text-[10px] ${clickable ? 'hover:bg-surface1' : ''}"`;
          if (clickable) html += ` onclick="showDetail(ITEM_BY_ID['${nm.replace(/'/g, "\\'")}'])"`;
          html += `>&#x2200; ${esc(nm)}</button>`;
        });
        html += `</div>`;
      } else {
        html += `<div class="text-subtext mt-1"><span class="text-overlay0">[${esc(c.type)}]</span> ${esc(c.text)}</div>`;
      }
    });
    html += `</div>`;
  });
  if (!Object.keys(docs).length) html += `<div class="text-xs text-overlay0">${q ? 'No coverage rows match the search.' : 'No coverage data.'}</div>`;
  html += `</div></div>`;

  html += `</div>`;
  root.innerHTML = html;

  // Type chips feed the global search bar — one search, every view.
  root.querySelectorAll('[data-htype]').forEach(btn => {
    btn.onclick = () => {
      const t = btn.getAttribute('data-htype');
      const searchBox = document.getElementById('search');
      const active = searchMode === 'diagnostics' && searchQuery === t.toLowerCase();
      const next = active ? '' : 'diag:' + t;
      if (searchBox) searchBox.value = next;
      parseSearch(next);
      render();
      renderHealth();
    };
  });
}


// ── D3 Graph v2 — canvas edges + viewport culling + zoom-based labels ──
// Diff nodes are always SVG (with animated glow). Regular nodes use canvas
// at overview zoom and SVG when zoomed in past SVG_DETAIL_ZOOM.
let graphInitialized = false;

function renderGraph() {
  if (graphInitialized) return;
  graphInitialized = true;

  const items = filtered(STRUCTURE_DATA);
  const nodes = [];
  const links = [];
  const seen = new Set();
  const itemById = {};

  // Build nodes from DATA items
  items.forEach(d => {
    const id = d.id || `${d.doc}:${d.line}`;
    if (seen.has(id)) return;
    seen.add(id);
    itemById[id] = d;
    const depth = d.depth != null ? d.depth : 0;
    nodes.push({ id, kind: d.kind || d.category || '', value: d.value || d.ctx || '', depth, color: kindDot(d.kind || d.category || '') });
  });

  // Build links from LAYERS.edges
  const edgeTypes = {};
  const seenEdge = new Set();
  LAYERS.edges.forEach(e => {
    edgeTypes[e.source + '>' + e.target] = e.type;
    const key = e.source + '>' + e.target;
    if (seenEdge.has(key)) return;
    seenEdge.add(key);
    [e.source, e.target].forEach(name => {
      if (!seen.has(name)) {
        seen.add(name);
        const item = ITEM_BY_ID[name];
        const depth = item ? (item.depth != null ? item.depth : 0) : 0;
        const kind = item ? (item.kind || item.category || '') : 'input';
        nodes.push({ id: name, kind, value: '', depth, color: kindDot(kind) });
      }
    });
    links.push({ source: e.source, target: e.target });
  });

  // Also add input edges from DATA items not covered by LAYERS.edges
  DATA.forEach(d => {
    const id = d.id || `${d.doc}:${d.line}`;
    if (!seen.has(id)) return;
    if (d.inputs) d.inputs.forEach(inp => {
      const inpName = typeof inp === 'string' ? inp : inp.name;
      const key = inpName + '>' + id;
      if (seenEdge.has(key)) return;
      seenEdge.add(key);
      if (!seen.has(inpName)) {
        seen.add(inpName);
        const inpItem = ITEM_BY_ID[inpName];
        const inpDepth = inpItem ? (inpItem.depth != null ? inpItem.depth : 0) : 0;
        nodes.push({ id: inpName, kind: inpItem ? inpItem.kind : 'input', value: '', depth: inpDepth, color: kindDot(inpItem ? inpItem.kind : 'input') });
      }
      links.push({ source: inpName, target: id });
    });
  });

  const TYPE_COLOR = {'use':C.green,'declare':C.overlay0,'pull':C.blue,'axiom-ref':C.peach,'diff':C.patronusGlow};

  // ── Pre-build adjacency map for O(1) neighbor lookups ──
  const neighbors = {};
  nodes.forEach(n => { neighbors[n.id] = new Set(); });
  links.forEach(l => {
    const sid = typeof l.source === 'string' ? l.source : l.source.id;
    const tid = typeof l.target === 'string' ? l.target : l.target.id;
    if (neighbors[sid]) neighbors[sid].add(tid);
    if (neighbors[tid]) neighbors[tid].add(sid);
  });

  // ── Identify dangling nodes ──
  const connectedSet = new Set();
  links.forEach(l => {
    const sid = typeof l.source === 'string' ? l.source : l.source.id;
    const tid = typeof l.target === 'string' ? l.target : l.target.id;
    connectedSet.add(sid);
    connectedSet.add(tid);
  });
  const danglingSet = new Set();
  nodes.forEach(n => { if (!connectedSet.has(n.id)) { n.dangling = true; danglingSet.add(n.id); } });

  // ── Graph metrics: connected components + interconnectivity ──
  const adj = {};
  links.forEach(l => {
    const sid = typeof l.source === 'string' ? l.source : l.source.id;
    const tid = typeof l.target === 'string' ? l.target : l.target.id;
    if (!adj[sid]) adj[sid] = [];
    if (!adj[tid]) adj[tid] = [];
    adj[sid].push(tid);
    adj[tid].push(sid);
  });

  const componentOf = {};
  const components = [];
  const visited = new Set();
  nodes.filter(n => !n.dangling).forEach(n => {
    if (visited.has(n.id)) return;
    const comp = new Set();
    const q = [n.id];
    while (q.length) {
      const cur = q.pop();
      if (visited.has(cur)) continue;
      visited.add(cur);
      comp.add(cur);
      (adj[cur] || []).forEach(nb => { if (!visited.has(nb)) q.push(nb); });
    }
    const idx = components.length;
    components.push(comp);
    comp.forEach(id => { componentOf[id] = idx; });
  });

  let mainCompIdx = 0;
  components.forEach((c, i) => { if (c.size > components[mainCompIdx].size) mainCompIdx = i; });
  const mainComp = components[mainCompIdx] || new Set();

  const hasChild = new Set();
  links.forEach(l => {
    const sid = typeof l.source === 'string' ? l.source : l.source.id;
    hasChild.add(sid);
  });
  const leaves = nodes.filter(n => !n.dangling && !hasChild.has(n.id));
  const mainLeaves = leaves.filter(n => mainComp.has(n.id));
  const interconnectivity = leaves.length > 0 ? mainLeaves.length / leaves.length : 1;

  // ── Taint data ──
  const _gtd = (typeof TAINT_DATA !== 'undefined') ? TAINT_DATA : {sources:[], tainted:[], reasons:{}};
  const taintSources = new Set(_gtd.sources);
  const _gAllTainted = new Set(_gtd.tainted);
  const taintPropagated = new Set([..._gAllTainted].filter(n => !taintSources.has(n)));
  const allTaintedSet = new Set([...taintSources, ...taintPropagated]);

  // ── Separate diff vs regular nodes ──
  const diffNodes = nodes.filter(n => n.kind === 'diff');
  const regularNodes = nodes.filter(n => n.kind !== 'diff');
  const diffIds = new Set(diffNodes.map(n => n.id));

  // ── Layout constants (reactive for resize/orientation) ──
  const maxDepth = Math.max(0, ...nodes.filter(n => !n.dangling).map(n => n.depth));
  const graphView = document.getElementById('graph-view');
  function viewW() { return (window.visualViewport ? window.visualViewport.width : window.innerWidth); }
  function viewH() { return (window.visualViewport ? window.visualViewport.height : window.innerHeight); }
  let width = viewW();
  let height = viewH() - 60;

  let BAND_W = Math.max(300, (width - 160) / Math.max(maxDepth + 1, 1));
  const PAD_LEFT = 80;
  let DANGLE_X = PAD_LEFT + (maxDepth + 2) * BAND_W;
  const NODE_R = 6;
  const DANGLE_R = 4;
  const DIFF_R = NODE_R * 1.4;
  const GLOW_R = DIFF_R * 2.5;

  // ── Canvas layer (edges + overview regular nodes) ──
  const canvas = document.createElement('canvas');
  canvas.style.position = 'absolute';
  canvas.style.top = '0';
  canvas.style.left = '0';
  canvas.style.pointerEvents = 'none';
  graphView.insertBefore(canvas, graphView.firstChild);
  const ctx = canvas.getContext('2d');

  function resizeCanvas() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.scale(dpr, dpr);
  }
  resizeCanvas();

  // ── SVG layer ──
  const svg = d3.select("#graph");
  svg.style("position", "absolute").style("top", "0").style("left", "0");
  const gRoot = svg.append("g");

  // ── SVG defs for diff gradients ──
  const defs = svg.append("defs");
  function _addGrad(id, highlight, core, outer) {
    const g = defs.append("radialGradient").attr("id", id).attr("cx", "35%").attr("cy", "35%");
    g.append("stop").attr("offset", "0%").attr("stop-color", highlight);
    g.append("stop").attr("offset", "50%").attr("stop-color", core);
    g.append("stop").attr("offset", "100%").attr("stop-color", outer);
  }
  _addGrad("patronus-coherent", C.patronusHighlight, C.patronusCore, C.patronusGlowOuter);
  _addGrad("patronus-tainted", C.red, C.patronusTaintCore, C.patronusTaintOuter);
  _addGrad("patronus-warn", C.yellow, C.patronusWarnCore, C.patronusWarnOuter);

  function _addGlowGrad(id, glow, outer) {
    const g = defs.append("radialGradient").attr("id", id);
    g.append("stop").attr("offset", "0%").attr("stop-color", glow).attr("stop-opacity", 1);
    g.append("stop").attr("offset", "40%").attr("stop-color", outer).attr("stop-opacity", 0.6);
    g.append("stop").attr("offset", "70%").attr("stop-color", outer).attr("stop-opacity", 0);
    g.append("stop").attr("offset", "100%").attr("stop-color", outer).attr("stop-opacity", 0);
  }
  _addGlowGrad("patronus-glow-coherent", C.patronusGlow, C.patronusGlowOuter);
  _addGlowGrad("patronus-glow-tainted", C.patronusTaintGlow, C.patronusTaintOuter);
  _addGlowGrad("patronus-glow-warn", C.patronusWarnGlow, C.patronusWarnOuter);

  function diffFillUrl(id) {
    const st = DIFF_STATE[id] || 'coherent';
    return `url(#patronus-${st})`;
  }
  function diffGlowUrl(id) {
    const st = DIFF_STATE[id] || 'coherent';
    return `url(#patronus-glow-${st})`;
  }

  // ── Dangling kind bands ──
  const danglingKinds = [...new Set(nodes.filter(n => n.dangling).map(n => n.kind))].sort();
  const DANGLE_BAND_H = danglingKinds.length > 1 ? height / (danglingKinds.length + 1) : height;
  const danglingKindY = {};
  danglingKinds.forEach((k, i) => { danglingKindY[k] = (i + 1) * DANGLE_BAND_H; });

  // ── Permanent SVG diff nodes (with animated glow, like v1) ──
  const diffNodeG = gRoot.append("g").attr("class", "diff-nodes-permanent");
  const diffSvgNode = diffNodeG.selectAll("g")
    .data(diffNodes).join("g").attr("class", "graph-node graph-diff-node cursor-pointer");

  // Diff glow — pulsing outer circle
  const diffGlow = diffSvgNode.append("circle")
    .attr("r", GLOW_R)
    .attr("fill", d => diffGlowUrl(d.id))
    .attr("opacity", 0.55);
  // Pulse animation via SVG <animate> — matches v1 exactly
  diffGlow.each(function() {
    const el = d3.select(this);
    el.append("animate").attr("attributeName", "r")
      .attr("values", `${GLOW_R*0.85};${GLOW_R*1.15};${GLOW_R*0.85}`)
      .attr("dur", "3s").attr("repeatCount", "indefinite");
    el.append("animate").attr("attributeName", "opacity")
      .attr("values", "0.55;0.35;0.55")
      .attr("dur", "3s").attr("repeatCount", "indefinite");
  });

  // Diff core
  diffSvgNode.append("circle")
    .attr("class", "node-dot")
    .attr("r", DIFF_R)
    .attr("fill", d => diffFillUrl(d.id))
    .attr("stroke", "none");

  // Diff labels
  diffSvgNode.append("text")
    .attr("class", "node-label")
    .attr("dx", DIFF_R + 4).attr("dy", 3)
    .attr("fill", C.text).attr("font-size", "8px")
    .text(d => {
      const short = d.id.includes('.') ? d.id.split('.').slice(1).join('.') : d.id;
      return short.length > 25 ? short.slice(0, 22) + '...' : short;
    });

  // Diff events
  diffSvgNode.on('mouseover', handleMouseOver)
    .on('mouseout', handleMouseOut)
    .on('click', handleClick);

  // ── Zoom state ──
  let currentTransform = d3.zoomIdentity;
  const LABEL_ZOOM_MIN = 0.35;
  const LABEL_ZOOM_FULL = 0.7;
  const SVG_DETAIL_ZOOM = 0.5;

  // ── Viewport culling ──
  function getViewport(transform) {
    const inv = transform.invert([0, 0]);
    const inv2 = transform.invert([width, height]);
    const pad = 50 / transform.k;
    return { x0: inv[0] - pad, y0: inv[1] - pad, x1: inv2[0] + pad, y1: inv2[1] + pad };
  }

  function inViewport(n, vp) {
    return n.x >= vp.x0 && n.x <= vp.x1 && n.y >= vp.y0 && n.y <= vp.y1;
  }

  // ── Pre-compute link colors ──
  let linkColors = null;
  function ensureLinkColors() {
    if (linkColors) return;
    linkColors = links.map(l => {
      const sid = l.source.id || l.source;
      const tid = l.target.id || l.target;
      const t = edgeTypes[sid + '>' + tid] || edgeTypes[tid + '>' + sid];
      return TYPE_COLOR[t] || C.surface2;
    });
  }

  // ── Selection + taint state ──
  // Taint and focus can coexist: taint is the base layer, focus overlays on top.
  let selectedPath = null;
  let selectedFocusId = null;
  let taintMode = false;

  // ── Compute visual state for a node ──
  function nodeAlpha(id, isDangling) {
    if (selectedPath && taintMode) {
      // Both active: path nodes bright, everything else equally dim
      if (selectedPath.has(id)) return 1;
      return 0.05;
    }
    if (selectedPath) return selectedPath.has(id) ? 1 : 0.08;
    if (taintMode) return allTaintedSet.has(id) ? 1 : 0.15;
    return isDangling ? 0.5 : 1;
  }

  function nodeColor(n) {
    if (taintMode) {
      if (n.kind === 'diff') return null; // handled by SVG gradient
      if (taintSources.has(n.id)) return C.red;
      if (taintPropagated.has(n.id)) return C.yellow;
    }
    return n.color;
  }

  function edgeAlpha(sid, tid) {
    if (selectedPath && taintMode) {
      if (selectedPath.has(sid) && selectedPath.has(tid)) return 0.8;
      return 0.02;
    }
    if (selectedPath) {
      return (selectedPath.has(sid) && selectedPath.has(tid)) ? 0.8 : 0.03;
    }
    if (taintMode) {
      return (allTaintedSet.has(sid) && allTaintedSet.has(tid)) ? 0.7 : 0.03;
    }
    return 0.35;
  }

  function edgeColor(sid, tid, baseColor) {
    if (taintMode && allTaintedSet.has(sid) && allTaintedSet.has(tid)) return C.red;
    return baseColor;
  }

  function edgeLw(sid, tid) {
    if (selectedPath && selectedPath.has(sid) && selectedPath.has(tid)) return 2;
    if (taintMode && allTaintedSet.has(sid) && allTaintedSet.has(tid)) return 2;
    if (selectedPath || taintMode) return 0.5;
    return 1;
  }

  // ── Canvas draw ──
  function drawCanvas(transform) {
    ensureLinkColors();
    ctx.save();
    ctx.clearRect(0, 0, width, height);
    ctx.translate(transform.x, transform.y);
    ctx.scale(transform.k, transform.k);

    const vp = getViewport(transform);
    const scale = transform.k;
    const showLabels = scale >= LABEL_ZOOM_MIN;
    const labelAlpha = showLabels ? Math.min(1, (scale - LABEL_ZOOM_MIN) / (LABEL_ZOOM_FULL - LABEL_ZOOM_MIN)) : 0;

    // ── Draw edges (batched by style to minimize draw calls) ──
    const edgeBuckets = {};
    for (let i = 0; i < links.length; i++) {
      const l = links[i];
      const sx = l.source.x, sy = l.source.y, tx = l.target.x, ty = l.target.y;
      if ((sx < vp.x0 && tx < vp.x0) || (sx > vp.x1 && tx > vp.x1) ||
          (sy < vp.y0 && ty < vp.y0) || (sy > vp.y1 && ty > vp.y1)) continue;

      const sid = l.source.id, tid = l.target.id;
      const color = edgeColor(sid, tid, linkColors[i]);
      const alpha = edgeAlpha(sid, tid);
      const lw = edgeLw(sid, tid);
      const key = color + '|' + alpha + '|' + lw;
      let bucket = edgeBuckets[key];
      if (!bucket) { bucket = { color, alpha, lw, path: new Path2D() }; edgeBuckets[key] = bucket; }
      bucket.path.moveTo(sx, sy);
      bucket.path.lineTo(tx, ty);
    }
    for (const k in edgeBuckets) {
      const b = edgeBuckets[k];
      ctx.strokeStyle = b.color;
      ctx.globalAlpha = b.alpha;
      ctx.lineWidth = b.lw;
      ctx.stroke(b.path);
    }

    // ── Draw regular nodes on canvas (batched by style) ──
    const drawSvgNodes = scale >= SVG_DETAIL_ZOOM;
    ctx.globalAlpha = 1;

    if (!drawSvgNodes) {
      const nodeBuckets = {};
      const labelNodes = [];
      for (let i = 0; i < regularNodes.length; i++) {
        const n = regularNodes[i];
        if (!inViewport(n, vp)) continue;

        const r = n.dangling ? DANGLE_R : NODE_R;
        const color = nodeColor(n) || n.color;
        const alpha = nodeAlpha(n.id, n.dangling);
        const key = color + '|' + alpha;
        let bucket = nodeBuckets[key];
        if (!bucket) { bucket = { color, alpha, path: new Path2D() }; nodeBuckets[key] = bucket; }
        bucket.path.moveTo(n.x + r, n.y);
        bucket.path.arc(n.x, n.y, r, 0, Math.PI * 2);

        if (showLabels && alpha > 0.1) labelNodes.push(n);
      }
      for (const k in nodeBuckets) {
        const b = nodeBuckets[k];
        ctx.fillStyle = b.color;
        ctx.globalAlpha = b.alpha;
        ctx.fill(b.path);
      }
