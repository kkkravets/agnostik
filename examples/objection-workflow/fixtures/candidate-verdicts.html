      // Labels (can't batch text, but drawn after nodes)
      if (labelNodes.length > 0) {
        const fontSize = Math.max(6, Math.min(10, 8));
        ctx.font = `${fontSize}px sans-serif`;
        for (let i = 0; i < labelNodes.length; i++) {
          const n = labelNodes[i];
          const r = n.dangling ? DANGLE_R : NODE_R;
          const alpha = nodeAlpha(n.id, n.dangling);
          ctx.fillStyle = n.dangling ? C.surface2 : C.text;
          ctx.globalAlpha = alpha * labelAlpha;
          const short = n.id.includes('.') ? n.id.split('.').slice(1).join('.') : n.id;
          const label = short.length > 25 ? short.slice(0, 22) + '...' : short;
          ctx.fillText(label, n.x + r + 3, n.y + 3);
        }
      }
    }

    ctx.restore();
  }

  // ── Dynamic SVG for regular nodes (only when zoomed in) ──
  let svgNodesCreated = false;
  let regularNode = null;  // D3 selection of regular SVG nodes
  let currentVisibleIds = new Set();

  function updateSvgNodes(transform) {
    const scale = transform.k;
    const showSvg = scale >= SVG_DETAIL_ZOOM;
    const vp = getViewport(transform);
    const showLabels = scale >= LABEL_ZOOM_MIN;
    const labelAlpha = showLabels ? Math.min(1, (scale - LABEL_ZOOM_MIN) / (LABEL_ZOOM_FULL - LABEL_ZOOM_MIN)) : 0;

    if (!showSvg) {
      if (svgNodesCreated) {
        gRoot.selectAll('.graph-node:not(.graph-diff-node)').remove();
        svgNodesCreated = false;
        currentVisibleIds.clear();
        regularNode = null;
      }
      // Still update diff node visuals
      _updateDiffVisuals(labelAlpha);
      return;
    }

    // Determine which regular nodes are in viewport
    const visibleNodes = regularNodes.filter(n => inViewport(n, vp));
    const visibleIds = new Set(visibleNodes.map(n => n.id));

    const added = visibleNodes.filter(n => !currentVisibleIds.has(n.id));
    const removed = [...currentVisibleIds].filter(id => !visibleIds.has(id));

    if (added.length > 0 || removed.length > 0) {
      if (removed.length > 0) {
        const removeSet = new Set(removed);
        gRoot.selectAll('.graph-node:not(.graph-diff-node)').filter(d => removeSet.has(d.id)).remove();
      }

      if (added.length > 0) {
        const newNodes = gRoot.selectAll('.graph-node-new')
          .data(added, d => d.id)
          .join('g')
          .attr('class', 'graph-node cursor-pointer')
          .attr('transform', d => `translate(${d.x},${d.y})`);

        newNodes.append('circle')
          .attr('class', 'node-dot')
          .attr('r', d => d.dangling ? DANGLE_R : NODE_R)
          .attr('fill', d => d.color)
          .attr('stroke', d => d.dangling ? C.base : C.surface0)
          .attr('stroke-width', d => d.dangling ? 0.5 : 1.5)
          .attr('opacity', d => d.dangling ? 0.5 : 1);

        newNodes.append('text')
          .attr('class', 'node-label')
          .attr('dx', d => (d.dangling ? DANGLE_R : NODE_R) + 4)
          .attr('dy', 3)
          .attr('fill', d => d.dangling ? C.surface2 : C.text)
          .attr('font-size', d => d.dangling ? '7px' : '8px')
          .text(d => {
            const short = d.id.includes('.') ? d.id.split('.').slice(1).join('.') : d.id;
            return short.length > 25 ? short.slice(0, 22) + '...' : short;
          });

        newNodes.on('mouseover', handleMouseOver)
          .on('mouseout', handleMouseOut)
          .on('click', handleClick);

        newNodes.call(d3.drag()
          .on('start', (e, d) => { if (!e.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
          .on('drag', (e, d) => { d.fx = e.x; d.fy = e.y; })
          .on('end', (e, d) => { if (!e.active) sim.alphaTarget(0); d.fx = null; d.fy = null; }));
      }

      currentVisibleIds = visibleIds;
    }

    regularNode = gRoot.selectAll('.graph-node:not(.graph-diff-node)');
    _applyRegularSvgVisuals(labelAlpha);
    _updateDiffVisuals(labelAlpha);
  }

  // ── Apply visuals to regular SVG nodes ──
  function _applyRegularSvgVisuals(labelAlpha) {
    if (!regularNode) return;
    regularNode.select('.node-dot')
      .attr('fill', d => nodeColor(d) || d.color)
      .attr('opacity', d => nodeAlpha(d.id, d.dangling))
      .attr('stroke', d => {
        if (selectedPath && d.id === selectedFocusId) return C.mauve;
        if (taintMode && taintSources.has(d.id)) return C.red;
        if (taintMode && taintPropagated.has(d.id)) return C.yellow;
        const findings = (typeof HEALTH_DATA !== 'undefined' && HEALTH_DATA[d.id]) || [];
        if (findings.some(f => f.category === 'issue')) return C.red;
        if (findings.some(f => f.category === 'warning')) return C.yellow;
        return d.dangling ? C.base : C.surface0;
      })
      .attr('stroke-width', d => {
        if (selectedPath && d.id === selectedFocusId) return 3;
        if (taintMode && (taintSources.has(d.id) || taintPropagated.has(d.id))) return 2;
        const findings = (typeof HEALTH_DATA !== 'undefined' && HEALTH_DATA[d.id]) || [];
        if (findings.some(f => f.category !== 'dangling')) return 2;
        return d.dangling ? 0.5 : 1.5;
      });
    regularNode.select('.node-label').attr('opacity', d => nodeAlpha(d.id, d.dangling) * (labelAlpha != null ? labelAlpha : 1));
  }

  // ── Apply visuals to permanent diff SVG nodes ──
  function _updateDiffVisuals(labelAlpha) {
    diffSvgNode.select('.node-dot')
      .attr('opacity', d => nodeAlpha(d.id, false));
    diffGlow.each(function(d) {
      const el = d3.select(this);
      const a = nodeAlpha(d.id, false);
      // Pause/resume animation based on visibility
      if (a < 0.1) {
        el.attr('opacity', 0.08);
        el.selectAll('animate').attr('begin', 'indefinite');
      } else {
        el.attr('opacity', null); // let animate control it
        el.selectAll('animate').attr('begin', '0s');
      }
    });
    diffSvgNode.select('.node-label').attr('opacity', d => nodeAlpha(d.id, false) * (labelAlpha != null ? labelAlpha : 1));
  }

  // ── Tooltip ──
  const tooltip = d3.select("#tooltip");

  function handleMouseOver(e, d) {
    let html = `<b>${d.id}</b>\nkind: ${d.kind}\ndepth: ${d.depth}`;
    if (d.value) html += `\n${d.value.slice(0, 120)}`;
    if (d.dangling) html += '\n(dangling)';
    if (taintSources.has(d.id)) html += '\n<span style="color:' + C.red + '">taint source</span>';
    else if (taintPropagated.has(d.id)) html += '\n<span style="color:' + C.yellow + '">taint propagated</span>';
    const ttX = Math.min(e.pageX + 12, width - 200);
    const ttY = Math.max(8, Math.min(e.pageY - 8, height - 100));
    tooltip.html(html).classed("hidden", false)
      .style("left", ttX + "px").style("top", ttY + "px");
    if (!selectedPath && !taintMode) {
      // Highlight neighbors
      const nb = neighbors[d.id] || new Set();
      const isNb = id => id === d.id || nb.has(id);
      if (regularNode) {
        regularNode.select('.node-dot').attr('opacity', n => isNb(n.id) ? 1 : 0.15);
        regularNode.select('.node-label').attr('opacity', n => isNb(n.id) ? 1 : 0.15);
      }
      diffGlow.each(function(n) {
        d3.select(this).attr('opacity', isNb(n.id) ? null : 0.08);
      });
      diffSvgNode.select('.node-dot').attr('opacity', n => isNb(n.id) ? 1 : 0.15);
      diffSvgNode.select('.node-label').attr('opacity', n => isNb(n.id) ? 1 : 0.15);
    }
    requestCanvasDraw();
  }

  function handleMouseOut() {
    tooltip.classed("hidden", true);
    requestCanvasDraw();
  }

  function handleClick(e, d) {
    e.stopPropagation();
    const item = ITEM_BY_ID[d.id];
    if (item) showDetail(item);
    // Focus works in both normal and taint mode
    const path = collectGraphPath(d.id);
    selectedPath = path;
    selectedFocusId = d.id;
    requestCanvasDraw();
    updateGraphStats(path);
  }

  // ── Collect subgraph path ──
  function collectGraphPath(id) {
    const parents = {};
    const children = {};
    links.forEach(l => {
      const sid = l.source.id, tid = l.target.id;
      if (!parents[tid]) parents[tid] = [];
      parents[tid].push(sid);
      if (!children[sid]) children[sid] = [];
      children[sid].push(tid);
      const t = edgeTypes[sid + '>' + tid] || edgeTypes[tid + '>' + sid];
      if (t === 'axiom-ref') {
        if (!parents[sid]) parents[sid] = [];
        parents[sid].push(tid);
        if (!children[tid]) children[tid] = [];
        children[tid].push(sid);
      }
    });
    const path = new Set();
    const q = [id];
    while (q.length) {
      const n = q.pop();
      if (path.has(n)) continue;
      path.add(n);
      (parents[n] || []).forEach(p => q.push(p));
    }
    const downVisited = new Set();
    const dq = [id];
    while (dq.length) {
      const n = dq.pop();
      if (downVisited.has(n)) continue;
      downVisited.add(n);
      path.add(n);
      (children[n] || []).forEach(c => dq.push(c));
    }
    return path;
  }

  // ── Force simulation ──
  const DIFF_Y = height + 120;
  const sim = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(links).id(d => d.id).distance(80).strength(0.3))
    .force("charge", d3.forceManyBody().strength(-200))
    .force("collide", d3.forceCollide().radius(28))
    .force("depthX", d3.forceX(d => {
      if (d.dangling) return DANGLE_X;
      if (d.kind === 'diff') return PAD_LEFT + maxDepth * BAND_W;
      return PAD_LEFT + d.depth * BAND_W;
    }).strength(d => d.dangling ? 0.8 : d.kind === 'diff' ? 0.9 : 0.85))
    .force("centerY", d3.forceY(d => {
      if (d.dangling) return danglingKindY[d.kind] || height / 2;
      if (d.kind === 'diff') return DIFF_Y;
      return height / 2;
    }).strength(d => d.dangling ? 0.3 : d.kind === 'diff' ? 0.7 : 0.05));

  // Diff drag
  diffSvgNode.call(d3.drag()
    .on('start', (e, d) => { if (!e.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
    .on('drag', (e, d) => { d.fx = e.x; d.fy = e.y; })
    .on('end', (e, d) => { if (!e.active) sim.alphaTarget(0); d.fx = null; d.fy = null; }));

  // ── Zoom handler ──
  let canvasDrawScheduled = false;
  function requestCanvasDraw() {
    if (canvasDrawScheduled) return;
    canvasDrawScheduled = true;
    requestAnimationFrame(() => {
      canvasDrawScheduled = false;
      drawCanvas(currentTransform);
      updateSvgNodes(currentTransform);
    });
  }

  const zoomBehavior = d3.zoom()
    .scaleExtent([0.05, 8])
    .on("zoom", (e) => {
      currentTransform = e.transform;
      gRoot.attr("transform", e.transform);
      if (e.sourceEvent) userInteracted = true;
      requestCanvasDraw();
    });
  svg.call(zoomBehavior);
  svg.on("click.zoom", null);  // disable double-click zoom (matches v1)

  // Background click to clear selection
  svg.on("click", () => {
    selectedPath = null;
    selectedFocusId = null;
    requestCanvasDraw();
    updateGraphStats(null);
  });

  // ── Stats + controls ──
  const wrapper = document.createElement('div');
  wrapper.className = 'absolute top-4 left-4 flex items-start gap-3 z-20 pointer-events-none';
  graphView.appendChild(wrapper);

  const statsDiv = document.createElement('div');
  statsDiv.id = 'graph-stats';
  statsDiv.className = 'bg-mantle/95 backdrop-blur border border-surface1 rounded-lg text-xs min-w-[160px] pointer-events-auto';
  wrapper.appendChild(statsDiv);

  // Clickable title bar: "Graph  123 nodes  ▾"
  let statsCollapsed = false;
  const statsHeader = document.createElement('div');
  statsHeader.className = 'flex items-center gap-2 px-3 py-2 cursor-pointer select-none';
  statsDiv.appendChild(statsHeader);
  const statsTitle = document.createElement('span');
  statsTitle.className = 'font-bold text-lavender';
  statsTitle.textContent = 'Graph';
  statsHeader.appendChild(statsTitle);
  const statsCount = document.createElement('span');
  statsCount.className = 'text-overlay0 font-normal';
  statsHeader.appendChild(statsCount);
  const statsChevron = document.createElement('span');
  statsChevron.className = 'text-overlay0 ml-auto text-[10px]';
  statsChevron.textContent = '\u25be';
  statsHeader.appendChild(statsChevron);

  const statsBody = document.createElement('div');
  statsBody.id = 'graph-stats-body';
  statsBody.className = 'px-3 pb-3';
  statsDiv.appendChild(statsBody);

  statsHeader.addEventListener('click', (e) => {
    e.stopPropagation();
    statsCollapsed = !statsCollapsed;
    statsBody.style.display = statsCollapsed ? 'none' : '';
    statsChevron.textContent = statsCollapsed ? '\u25b8' : '\u25be';
  });

  const taintBtnEl = document.createElement('button');
  taintBtnEl.id = 'btn-graph-taints';
  taintBtnEl.className = 'px-3 py-1 rounded-lg text-xs bg-surface0 text-subtext border border-surface2 hover:bg-surface1 pointer-events-auto';
  taintBtnEl.textContent = 'Taints';
  wrapper.appendChild(taintBtnEl);

  taintBtnEl.addEventListener('click', () => {
    taintMode = !taintMode;
    // Don't clear selection — taint + focus coexist
    if (taintMode) {
      taintBtnEl.classList.add('bg-red', 'text-crust', 'border-red');
      taintBtnEl.classList.remove('bg-surface0', 'text-subtext', 'border-surface2');
    } else {
      taintBtnEl.classList.remove('bg-red', 'text-crust', 'border-red');
      taintBtnEl.classList.add('bg-surface0', 'text-subtext', 'border-surface2');
    }
    requestCanvasDraw();
    updateGraphStats(selectedPath);
  });

  // ── Depth band labels ──
  let bandLabelsDrawn = false;
  function drawBandLabels() {
    if (bandLabelsDrawn) return;
    bandLabelsDrawn = true;
    for (let d = 0; d <= maxDepth; d++) {
      gRoot.append("text")
        .attr("x", PAD_LEFT + d * BAND_W).attr("y", 20)
        .attr("text-anchor", "middle")
        .attr("fill", C.overlay0).attr("font-size", "9px").attr("font-weight", "bold")
        .text(`d${d}`);
    }
    if (danglingSet.size > 0) {
      gRoot.append("text")
        .attr("x", DANGLE_X).attr("y", 20)
        .attr("text-anchor", "middle")
        .attr("fill", C.surface2).attr("font-size", "9px").attr("font-style", "italic")
        .text(`dangling (${danglingSet.size})`);
      danglingKinds.forEach(k => {
        const count = nodes.filter(n => n.dangling && n.kind === k).length;
        gRoot.append("text")
          .attr("x", DANGLE_X - 60).attr("y", danglingKindY[k])
          .attr("text-anchor", "end")
          .attr("fill", kindDot(k)).attr("font-size", "8px").attr("font-style", "italic")
          .text(`${k} (${count})`);
      });
    }
  }

  // ── Stats ──
  function updateGraphStats(filterSet) {
    const fNodes = filterSet ? nodes.filter(n => filterSet.has(n.id)) : nodes;
    const kindCounts = {};
    let danglingCount = 0;
    fNodes.forEach(n => {
      if (!kindCounts[n.kind]) kindCounts[n.kind] = 0;
      kindCounts[n.kind]++;
      if (n.dangling) danglingCount++;
    });

    const total = fNodes.length;
    const maxDepthF = Math.max(0, ...fNodes.map(n => n.depth));
    const kindEntries = Object.entries(kindCounts).sort((a,b) => b[1] - a[1]);
    const maxK = kindEntries.length ? Math.max(...kindEntries.map(([,v]) => v)) : 1;

    statsTitle.textContent = filterSet ? 'Selection' : 'Graph';
    statsCount.textContent = `${total} nodes`;
    let html = '';
    kindEntries.forEach(([k, count]) => {
      const barW = Math.max(4, (count / maxK) * 80);
      const color = kindDot(k);
      html += `<div class="flex items-center gap-2 mb-0.5">`;
      html += `<div style="width:${barW}px;height:5px;background:${color};border-radius:2px;opacity:0.85"></div>`;
      html += `<span style="color:${color}" class="text-[10px]">${k} ${count}</span>`;
      html += `</div>`;
    });
    html += `<div class="mt-2 text-overlay0">depth: 0\u2013${maxDepthF}</div>`;
    if (danglingCount > 0) html += `<div class="text-overlay0">dangling: ${danglingCount}</div>`;
    if (!filterSet) {
      html += `<div class="mt-2 border-t border-surface1 pt-2">`;
      html += `<div class="text-overlay0">components: <span class="text-text font-bold">${components.length}</span></div>`;
      const icPct = Math.round(interconnectivity * 100);
      const icColor = icPct >= 80 ? C.green : icPct >= 50 ? C.yellow : C.red;
      html += `<div class="text-overlay0">interconnectivity: <span style="color:${icColor}" class="font-bold">${icPct}%</span></div>`;
      html += `<div class="text-overlay0 text-[10px]">${mainLeaves.length}/${leaves.length} leaves in main</div>`;
      html += `</div>`;
    }
    const fNodeIds = filterSet || new Set(nodes.map(n => n.id));
    const fSources = [...taintSources].filter(id => fNodeIds.has(id));
    const fPropagated = [...taintPropagated].filter(id => fNodeIds.has(id));
    if (fSources.length > 0) {
      const pctS = total ? Math.round(fSources.length / total * 100) : 0;
      html += `<div class="mt-1"><span class="text-red font-bold">${fSources.length}/${pctS}%</span> <span class="text-red text-[10px]">unverified</span></div>`;
    }
    if (fPropagated.length > 0) {
      const pctP = total ? Math.round(fPropagated.length / total * 100) : 0;
      html += `<div><span class="text-yellow font-bold">${fPropagated.length}/${pctP}%</span> <span class="text-yellow text-[10px]">propagated</span></div>`;
    }
    if (fSources.length === 0 && fPropagated.length === 0) {
      html += `<div class="mt-1 text-green text-[10px]">\u2713 clean</div>`;
    }
    statsBody.innerHTML = html;
  }

  updateGraphStats(null);

  // ── External focus API ──
  window._graphFocusNode = function(name) {
    const target = nodes.find(n => n.id === name);
    if (!target) return;
    // Don't disable taint — focus overlays on top
    const path = collectGraphPath(name);
    selectedPath = path;
    selectedFocusId = name;
    requestCanvasDraw();
    updateGraphStats(path);
    const scale = 1.2;
    const fitW = width;
    const tx = fitW / 2 - target.x * scale;
    const ty = height / 2 - target.y * scale;
    svg.transition().duration(600).call(
      zoomBehavior.transform, d3.zoomIdentity.translate(tx, ty).scale(scale)
    );
    const item = ITEM_BY_ID[name];
    if (item) showDetail(item);
  };

  // ── Resize handler (orientation change, virtual keyboard, window resize) ──
  let resizeTimer = null;
  function _onResize() {
    if (resizeTimer) clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      resizeTimer = null;
      const newW = viewW();
      const newH = viewH() - 60;
      if (newW === width && newH === height) return;
      width = newW;
      height = newH;
      BAND_W = Math.max(300, (width - 160) / Math.max(maxDepth + 1, 1));
      DANGLE_X = PAD_LEFT + (maxDepth + 2) * BAND_W;
      resizeCanvas();
      svg.attr("width", width).attr("height", height);
      requestCanvasDraw();
    }, 150);
  }
  window.addEventListener('resize', _onResize);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', _onResize);

  // ── Tick ──
  sim.on("tick", () => {
    // Update permanent diff SVG positions
    diffSvgNode.attr('transform', d => `translate(${d.x},${d.y})`);
    // Update dynamic regular SVG positions
    if (svgNodesCreated || currentTransform.k >= SVG_DETAIL_ZOOM) {
      gRoot.selectAll('.graph-node:not(.graph-diff-node)').attr('transform', d => `translate(${d.x},${d.y})`);
      svgNodesCreated = gRoot.selectAll('.graph-node:not(.graph-diff-node)').size() > 0;
    }
    // Camera follow: track focused node during simulation until user interacts
    if (selectedFocusId && !userInteracted) {
      const target = nodes.find(n => n.id === selectedFocusId);
      if (target) {
        const scale = currentTransform.k;
        const tx = width / 2 - target.x * scale;
        const ty = height / 2 - target.y * scale;
        svg.call(zoomBehavior.transform, d3.zoomIdentity.translate(tx, ty).scale(scale));
      }
    }
    requestCanvasDraw();
  });

  // Auto-zoom to fit — only if user hasn't manually zoomed/panned
  // Uses getBBox() on the SVG gRoot (same as v1) for consistent framing.
  let initialFitDone = false;
  let userInteracted = false;
  sim.on("end", () => {
    if (initialFitDone) return;
    initialFitDone = true;
    if (userInteracted) { drawBandLabels(); return; }
    drawBandLabels();
    requestAnimationFrame(() => {
      // Temporarily add all nodes as SVG so getBBox captures their labels
      const tempG = gRoot.append("g").attr("class", "temp-fit-nodes");
      regularNodes.forEach(n => {
        const g = tempG.append("g").attr("transform", `translate(${n.x},${n.y})`);
        g.append("circle").attr("r", n.dangling ? DANGLE_R : NODE_R);
        const short = n.id.includes('.') ? n.id.split('.').slice(1).join('.') : n.id;
        const label = short.length > 25 ? short.slice(0, 22) + '...' : short;
        g.append("text").attr("dx", (n.dangling ? DANGLE_R : NODE_R) + 4).attr("dy", 3)
          .attr("font-size", n.dangling ? "7px" : "8px").text(label);
      });
      const bounds = gRoot.node().getBBox();
      tempG.remove();

      if (bounds.width > 0 && bounds.height > 0) {
        const fitW = width;
        const scale = Math.min(fitW / (bounds.width + 160), height / (bounds.height + 160), 1);
        const tx = (fitW - bounds.width * scale) / 2 - bounds.x * scale;
        const ty = (height - bounds.height * scale) / 2 - bounds.y * scale;
        svg.transition().duration(800).call(
          zoomBehavior.transform, d3.zoomIdentity.translate(tx, ty).scale(scale)
        );
      }
    });
  });
}


// ── Layers View: stacked pills with curved connections ──

// State-aware text/stroke for diff pills (color-mixed patronus palette)
function _pillTextFill(name, kind) {
  return diffTextPrimary(name) || C.text;
}
function _pillStroke(name, kind) {
  if (kind !== 'diff') return kindDot(kind);
  const st = DIFF_STATE[name];
  if (!st || st === 'coherent') return C.patronusLine;
  if (st === 'tainted') return C.patronusTaintOuter;
  return C.patronusWarnOuter;  // warn
}

let layersInitialized = false;
let focusedId = null;
const _expandedPrefixes = new Set();  // tracks which prefix groups are expanded (persists across re-renders)
let _taintsOn = false;
let _taintFocusOn = false;
const _focusStack = [];  // persists across re-renders: [{path, focusId}]

const _MIN_GROUP = 10;  // minimum members to collapse a prefix group
function _segments(label) { return label.split(/[.\-]/); }
function _prefixAt(segs, depth) { return segs.slice(0, depth).join('.'); }

// Given a list of input pills and a layer index, compute prefix assignments.
// Returns {assignment: Map<inp, prefixKey>, members: {prefixKey: [inp]}}
// Also takes mustShowFn(inp) — pills that must stay explicit even if groupable.
function _computePrefixGroups(inputs, li, mustShowFn) {
  const assignment = new Map();
  const members = {};
  if (!inputs.length) return {assignment, members};

  const depthGroups = {};
  inputs.forEach(inp => {
    const segs = _segments(inp.label);
    for (let d = 1; d < segs.length; d++) {
      const p = _prefixAt(segs, d);
      const key = d + ':' + p;
      if (!depthGroups[key]) depthGroups[key] = [];
      depthGroups[key].push(inp);
    }
  });
  inputs.forEach(inp => {
    if (mustShowFn && mustShowFn(inp)) return;  // skip must-show items
    const segs = _segments(inp.label);
    let bestPrefix = null;
    for (let d = segs.length - 1; d >= 1; d--) {
      const p = _prefixAt(segs, d);
      const key = d + ':' + p;
      if (depthGroups[key] && depthGroups[key].length >= _MIN_GROUP) { bestPrefix = p; break; }
    }
    if (bestPrefix) {
      const pk = bestPrefix + '@' + li;
      assignment.set(inp, pk);
      if (!members[pk]) members[pk] = [];
      members[pk].push(inp);
    }
  });
  return {assignment, members};
}

// Build collapsedInputs array from inputs + prefix groups
function _buildCollapsedInputs(inputs, assignment, members) {
  const collapsed = [];
  const groups = {};
  const ungrouped = new Set();
  inputs.forEach(inp => {
    const pk = assignment.get(inp);
    if (pk && members[pk].length >= _MIN_GROUP && !_expandedPrefixes.has(pk)) {
      if (!groups[pk]) {
        const grp = members[pk];
        const allConsumers = [];
        grp.forEach(g => allConsumers.push(...g.consumers));
        const displayPrefix = pk.split('@')[0];
        const cid = 'grp:' + pk;
        const cpill = {id: cid, label: displayPrefix + '.* (' + grp.length + ')', consumers: allConsumers, type: grp[0].type, _isCollapsed: true, _prefix: pk, _children: grp};
        groups[pk] = cpill;
        collapsed.push(cpill);
      }
    } else if (pk && members[pk].length >= _MIN_GROUP && _expandedPrefixes.has(pk)) {
      if (!groups[pk]) {
        const displayPrefix = pk.split('@')[0];
        const hid = 'grphdr:' + pk;
        const hpill = {id: hid, label: displayPrefix + '.* \u25B4', consumers: [], type: members[pk][0].type, _isExpandedHeader: true, _prefix: pk};
        groups[pk] = hpill;
        collapsed.push(hpill);
      }
      ungrouped.add(inp.id);
      collapsed.push(inp);
    } else {
      ungrouped.add(inp.id);
      collapsed.push(inp);
    }
  });
  return {collapsed, groups, ungrouped};
}

function renderLayers() {
  if (layersInitialized) return;
  layersInitialized = true;

  if (!LAYERS.layers.length) {
    document.getElementById('layers-svg').outerHTML =
      '<div class="flex items-center justify-center h-full text-overlay0">No structural data available for layers view.</div>';
    return;
  }

  const svg = d3.select("#layers-svg");
  const W = window.innerWidth;
  const H = window.innerHeight - 60;
  const g = svg.append("g");
  const zoomBehavior = d3.zoom().scaleExtent([0.02, 10]).on("zoom", (e) => g.attr("transform", e.transform));
  svg.call(zoomBehavior);

  const tooltip = d3.select("#layers-tooltip");
  const info = document.getElementById("layer-info");

  // ── Build dependency maps ──
  const parentsOf = {};   // name → [input names]
  const childrenOf = {};  // name → [consumer names]
  LAYERS.edges.forEach(e => {
    if (!parentsOf[e.target]) parentsOf[e.target] = [];
    parentsOf[e.target].push(e.source);
    if (!childrenOf[e.source]) childrenOf[e.source] = [];
    childrenOf[e.source].push(e.target);
  });

  function collectPath(id) {
    const path = new Set();
    const upQ = [id];
    while (upQ.length) {
      const n = upQ.pop();
      if (path.has(n)) continue;
      path.add(n);
      (parentsOf[n] || []).forEach(p => upQ.push(p));
    }
    const downQ = [id];
    while (downQ.length) {
      const n = downQ.pop();
      if (path.has(n)) continue;
      path.add(n);
      (childrenOf[n] || []).forEach(c => downQ.push(c));
    }
    return path;
  }

  // ── Layout: "rails but pills" — input column + result column per layer ──
  const PH = 26;           // result pill height
  const SUB_PH = 18;       // input sub-pill height
  const PW_MIN = 130;      // min result pill width
  const PW_MAX = 240;      // max result pill width
  const SPW_MIN = 80;      // min sub-pill width
  const SPW_MAX = 180;     // max sub-pill width
  const GAP_X = 50;        // gap between layers
  const GAP_XI = 12;       // gap between input col and result col
  const GAP_Y = 8;         // gap between consumer rows
  const SUB_GAP_Y = 2;     // gap between input pills in a group
  const LABEL_H = 68;      // layer label height (L title + stats widget)
  const HEADER_GAP = 18;   // gap between header zone and pill stacks
  const PAD = 30;           // padding

  const pos = {};
  const nodeData = {};
  const inputPillData = {};

  function getConsumerInputs(n) {
    // Uses and declares (facts) get input sub-pills. Pulls are just lines.
    const pills = [];
    (n.uses || []).forEach(u => pills.push({id: 'inp:'+u+'>'+n.name, label: u, consumer: n.name, type: 'use'}));
    (n.declares || []).forEach(d => pills.push({id: 'inp:'+d+'>'+n.name, label: d, consumer: n.name, type: 'declare'}));
    return pills;
  }

  const TYPE_COLOR = {'use':C.green,'declare':C.overlay0,'pull':C.blue,'axiom-ref':C.peach};
  const TYPE_STROKE = {'use':C.green,'declare':C.surface2,'pull':C.blue};

  // ── Identify hanging nodes: L0 nodes that never reach a deeper layer ──
  // A node is hanging if no path from it leads to any node in layer > 0.
  const deepNames = new Set();
  LAYERS.layers.forEach(lay => { if (lay.depth > 0) lay.nodes.forEach(n => deepNames.add(n.name)); });
  const l0Names = new Set();
  LAYERS.layers.forEach(lay => { if (lay.depth === 0) lay.nodes.forEach(n => l0Names.add(n.name)); });
  // Build forward adjacency: source → [targets]
  const fwd = {};
  LAYERS.edges.forEach(e => { if (!fwd[e.source]) fwd[e.source] = []; fwd[e.source].push(e.target); });
  // BFS from each L0 node — does it reach any deep node?
  const reachesDeep = new Set();
  l0Names.forEach(start => {
    if (reachesDeep.has(start)) return;
    const visited = new Set();
    const q = [start];
    let found = false;
    while (q.length) {
      const n = q.pop();
      if (visited.has(n)) continue;
      visited.add(n);
      if (deepNames.has(n)) { found = true; break; }
      (fwd[n] || []).forEach(t => q.push(t));
    }
    if (found) visited.forEach(v => { if (l0Names.has(v)) reachesDeep.add(v); });
  });
  const hangingNodes = [];

  // ── Measure and layout ──
  let curX = PAD;
  LAYERS.layers.forEach((lay, li) => {
    // Separate hanging from connected in layer 0
    if (lay.depth === 0) {
      const connected = [];
      lay.nodes.forEach(n => {
        nodeData[n.name] = n;
        if (reachesDeep.has(n.name)) connected.push(n);
        else hangingNodes.push(n);
      });
      lay.nodes = connected;
      if (!connected.length) return;
    } else {
      lay.nodes.forEach(n => { nodeData[n.name] = n; });
    }

    // Collect input pills — deduped by source name within layer (uses + declares)
    const useSeen = {};
    const layerInputs = [];
    lay.nodes.forEach(n => {
      (n.uses || []).forEach(u => {
        if (!useSeen[u]) {
          useSeen[u] = {id: 'inp:'+u+'@'+li, label: u, consumers: [], type: 'use'};
          layerInputs.push(useSeen[u]);
        }
        useSeen[u].consumers.push(n.name);
      });
      (n.declares || []).forEach(d => {
        if (!useSeen[d]) {
          useSeen[d] = {id: 'inp:'+d+'@'+li, label: d, consumers: [], type: 'declare'};
          layerInputs.push(useSeen[d]);
        }
        useSeen[d].consumers.push(n.name);
      });
    });
    // ── Collapse inputs sharing a common prefix ──
    const {assignment: _inpAssignment, members: _prefixMembers} = _computePrefixGroups(layerInputs, li, null);
    const {collapsed: collapsedInputs, groups: _collapsedGroups, ungrouped} = _buildCollapsedInputs(layerInputs, _inpAssignment, _prefixMembers);
    // Replace layerInputs with collapsed version for layout
    const displayInputs = collapsedInputs;
    displayInputs.forEach(p => { inputPillData[p.id] = p; });
    // Also register children for edge routing (only collapsed pills have _children)
    Object.values(_collapsedGroups).forEach(cpill => {
      if (cpill._children) cpill._children.forEach(ch => { inputPillData[ch.id] = ch; ch._groupId = cpill.id; });
    });
    const hasInputs = displayInputs.length > 0;

    // Measure input column width
    let inputColW = 0;
    if (hasInputs) {
      displayInputs.forEach(inp => {
        const short = inp.label.includes('.') ? inp.label.split('.').slice(1).join('.') : inp.label;
        inp._w = Math.min(SPW_MAX, Math.max(SPW_MIN, short.length * 5.5 + 20));
        inputColW = Math.max(inputColW, inp._w);
      });
    }

    // Measure result column width
    let resultColW = 0;
    lay.nodes.forEach(n => {
      const short = n.name.includes('.') ? n.name.split('.').slice(1).join('.') : n.name;
      const label = short + (n.value ? ' =' + String(n.value).slice(0,15) : '');
      n._w = Math.min(PW_MAX, Math.max(PW_MIN, label.length * 6.5 + 28));
      resultColW = Math.max(resultColW, n._w);
    });

    const inputX = curX;
    const resultX = hasInputs ? curX + inputColW + GAP_XI : curX;
    lay._labelX = curX;
    lay._colW = resultX + resultColW - curX;
    lay._inputX = inputX;
    lay._inputColW = inputColW;
    lay._hasInputs = hasInputs;

    // Position input pills (deduped, stacked in input column)
    let inputY = PAD + LABEL_H + HEADER_GAP;
    displayInputs.forEach(inp => {
      pos[inp.id] = {
        x: inputX, y: inputY,
        w: inp._w, h: SUB_PH, isInput: true, type: inp.type, depth: lay.depth,
        _isCollapsed: !!inp._isCollapsed
      };
      // Also position hidden children at the same spot (for edge routing)
      if (inp._isCollapsed) {
        inp._children.forEach(ch => {
          pos[ch.id] = { x: inputX, y: inputY, w: inp._w, h: SUB_PH, isInput: true, type: ch.type, depth: lay.depth, _hidden: true };
        });
      }
      inputY += SUB_PH + SUB_GAP_Y;
    });

    // Position result pills (stacked in result column)
    let resultY = PAD + LABEL_H + HEADER_GAP;
    lay.nodes.forEach(n => {
      pos[n.name] = { x: resultX, y: resultY, w: n._w, h: PH, depth: lay.depth };
      resultY += PH + GAP_Y;
    });
    lay._colH = Math.max(inputY, resultY);
    curX = resultX + resultColW + GAP_X;
  });

  // ── Taint data (pre-computed by Python, single source of truth) ──
  const _taintData = (typeof TAINT_DATA !== 'undefined') ? TAINT_DATA : {sources:[], tainted:[], reasons:{}};
  const taintSources = new Set(_taintData.sources);
  const _allTainted = new Set(_taintData.tainted);
  const taintReasons = _taintData.reasons || {};
  function computeTainted() { return new Set(_allTainted); }

  // ── Draw layer labels + stats widget ──
  function pct(n, t) { return t ? Math.round(n / t * 100) : 0; }

  // Store per-layer stats metadata for recomputation on selection
  const layerStatsInfo = [];  // [{lay, cx, wx, labelY}]

  function computeLayerStats(lay, filterSet) {
    // Compute kind counts + taint numbers, optionally filtered to a path set
    const kindCounts = {};
    let taintedCount = 0, taintSourceCount = 0;

    const nodes = filterSet ? lay.nodes.filter(n => filterSet.has(n.name)) : lay.nodes;
    nodes.forEach(n => {
      if (!kindCounts[n.kind]) kindCounts[n.kind] = {main: 0, input: 0};
      kindCounts[n.kind].main++;
      if (taintSources.has(n.name)) taintSourceCount++;
      if (_allTainted.has(n.name)) taintedCount++;
    });

    const inpSeen = new Set();
    nodes.forEach(n => {
      (n.uses || []).forEach(u => { if (!filterSet || filterSet.has(u)) { if (!inpSeen.has(u)) inpSeen.add(u); } });
      (n.declares || []).forEach(d => { if (!filterSet || filterSet.has(d)) { if (!inpSeen.has(d)) inpSeen.add(d); } });
    });
    let inpTainted = 0, inpUnverified = 0;
    inpSeen.forEach(name => {
      if (_allTainted.has(name)) inpTainted++;
      if (taintSources.has(name)) inpUnverified++;
      const item = ITEM_BY_ID[name];
      const k = item ? item.kind : 'unknown';
      if (!kindCounts[k]) kindCounts[k] = {main: 0, input: 0};
      kindCounts[k].input++;
    });

    const total = nodes.length;
    const inputTotal = inpSeen.size;
    const allTotal = total + inputTotal;
    const allUnverified = taintSourceCount + inpUnverified;
    const allTaintedN = taintedCount + inpTainted;
    const allPropagated = allTaintedN - allUnverified;

    const kindEntries = Object.entries(kindCounts).sort((a,b) => (b[1].main + b[1].input) - (a[1].main + a[1].input));
    const maxCount = kindEntries.length ? Math.max(...kindEntries.map(([,v]) => v.main + v.input)) : 1;

    return {kindEntries, maxCount, allUnverified, allPropagated, allTotal, nodes};
  }

  function drawStats(parentG, lay, stats, wx, labelY) {
    const {kindEntries, maxCount, allUnverified, allPropagated, allTotal} = stats;

    const panelS = 66;
    const barChartW = panelS;
    const barH = Math.min(6, Math.max(3, (panelS - 4) / Math.max(kindEntries.length, 1) - 1));
    const panelH = Math.max(panelS, kindEntries.length * (barH + 1) + 4);
    const taintLineH = 12;
    const widgetH = panelH + taintLineH;

    const widgetBottom = labelY + 2;
    const widgetTop = widgetBottom - widgetH;

    // Remove old stats group if any
    parentG.selectAll('.stats-widget-' + lay.depth).remove();

    const sg = parentG.append("g")
      .attr("transform", `translate(${wx},${widgetTop})`)
      .attr("class", "layer-label stats-widget-" + lay.depth);

    // Background
    const labelW = kindEntries.length ? Math.max(...kindEntries.map(([k, v]) => (k + ' ' + (v.main + v.input)).length)) * 3.2 + 4 : 20;
    const totalW = barChartW + labelW + 4;
    sg.append("rect").attr("width", totalW).attr("height", widgetH).attr("rx", 4)
      .attr("fill", C.mantle).attr("stroke", C.surface0).attr("stroke-width", 0.5).attr("opacity", 0.85);

    let by = 3;
    const barsMaxW = barChartW - 6;
    kindEntries.forEach(([k, counts]) => {
      const totalK = counts.main + counts.input;
      const fullW = Math.max(2, (totalK / maxCount) * barsMaxW);
      const mainW = Math.max(1, (counts.main / maxCount) * barsMaxW);
      const color = kindDot(k);

      if (counts.input > 0) {
        sg.append("rect")
          .attr("x", 3).attr("y", by).attr("width", fullW).attr("height", barH).attr("rx", 1)
          .attr("fill", color).attr("opacity", 0.25);
      }
      if (counts.main > 0) {
        sg.append("rect")
          .attr("x", 3).attr("y", by).attr("width", mainW).attr("height", barH).attr("rx", 1)
          .attr("fill", color).attr("opacity", 0.85);
      }
      let kindTainted = 0;
      lay.nodes.forEach(n => { if (n.kind === k && _allTainted.has(n.name)) kindTainted++; });
      if (kindTainted > 0) {
        const tw = Math.max(1, (kindTainted / maxCount) * barsMaxW);
        sg.append("rect")
          .attr("x", 3).attr("y", by + barH - 1.5).attr("width", tw).attr("height", 1.5).attr("rx", 0.5)
          .attr("fill", C.red).attr("opacity", 0.7);
      }

      sg.append("text")
        .attr("x", barChartW).attr("y", by + barH - 0.5)
        .attr("fill", color).attr("font-size", "5px").attr("opacity", 0.8)
        .text(`${k} ${totalK}`);
      by += barH + 1;
    });

    const ty = panelH + 1;
    let tx = 4;
    if (allUnverified > 0) {
      sg.append("text").attr("x", tx).attr("y", ty + 7)
        .attr("fill", C.red).attr("font-size", "7px").attr("font-weight", "bold")
        .text(`${allUnverified}/${pct(allUnverified, allTotal)}%`);
      tx += (`${allUnverified}/${pct(allUnverified, allTotal)}%`).length * 4 + 2;
      sg.append("text").attr("x", tx).attr("y", ty + 7)
        .attr("fill", C.red).attr("font-size", "5px").attr("opacity", 0.7)
        .text(`unverified`);
      tx += 32;
    }
    if (allPropagated > 0) {
      sg.append("text").attr("x", tx).attr("y", ty + 7)
        .attr("fill", C.yellow).attr("font-size", "7px").attr("font-weight", "bold")
        .text(`${allPropagated}/${pct(allPropagated, allTotal)}%`);
      tx += (`${allPropagated}/${pct(allPropagated, allTotal)}%`).length * 4 + 2;
      sg.append("text").attr("x", tx).attr("y", ty + 7)
        .attr("fill", C.yellow).attr("font-size", "5px").attr("opacity", 0.7)
        .text(`tainted`);
    }
    if (allUnverified === 0 && allPropagated === 0) {
      sg.append("text").attr("x", tx).attr("y", ty + 7)
        .attr("fill", C.green).attr("font-size", "5.5px").attr("opacity", 0.7)
        .text('\u2713 clean');
    }
  }

  function recomputeAllStats(filterSet) {
    layerStatsInfo.forEach(({lay, cx, wx, labelY}) => {
      const stats = computeLayerStats(lay, filterSet);
      drawStats(g, lay, stats, wx, labelY);
    });
  }

  LAYERS.layers.forEach(lay => {
    if (!lay.nodes.length) return;
    const cx = lay._labelX + lay._colW / 2;

    // Separator line
    g.append("line")
      .attr("x1", lay._labelX - 6).attr("y1", PAD)
      .attr("x2", lay._labelX - 6).attr("y2", lay._colH || PAD + 40)
      .attr("stroke", C.surface0).attr("stroke-width", 1).attr("stroke-dasharray", "3,3")
      .attr("class", "layer-label");

    // "inputs" label
    if (lay._hasInputs) {
      g.append("text")
        .attr("x", lay._inputX + lay._inputColW / 2).attr("y", PAD + LABEL_H - 4)
        .attr("text-anchor", "middle")
        .attr("fill", C.green).attr("font-size", "8px").attr("font-style", "italic")
        .attr("class", "layer-label")
        .text("inputs");
    }

    // L label aligned with inputs label
    const labelY = PAD + LABEL_H - 4;
    g.append("text")
      .attr("x", cx).attr("y", labelY)
      .attr("text-anchor", "middle")
      .attr("fill", C.overlay0).attr("font-size", "10px").attr("font-weight", "bold")
      .attr("class", "layer-label")
      .text(`L${lay.depth} (${lay.nodes.length})`);

    const wx = cx + 36;
    layerStatsInfo.push({lay, cx, wx, labelY});

    // Draw initial stats (unfiltered)
    const stats = computeLayerStats(lay, null);
    drawStats(g, lay, stats, wx, labelY);
  });

  // ── Helper: draw bezier between two positioned elements ──
  function bezier(sp, tp, fromRight, toLeft) {
    const x1 = fromRight ? sp.x + sp.w : sp.x;
    const y1 = sp.y + sp.h / 2;
    const x2 = toLeft ? tp.x : tp.x + tp.w;
    const y2 = tp.y + tp.h / 2;
    if (Math.abs(x2 - x1) < 2) {
      // Vertical: arc left
      const xBase = Math.min(sp.x, tp.x);
      const arcW = 16 + Math.abs(y2 - y1) * 0.05;
      return `M${xBase},${y1} C${xBase-arcW},${y1} ${xBase-arcW},${y2} ${xBase},${y2}`;
    }
    const dx = (x2 - x1) * 0.35;
    return `M${x1},${y1} C${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}`;
  }

  // ── Draw edges routed through input pills ──
  const edgeEls = [];
  const drawnSourceToInp = new Set();  // avoid duplicate source→inp lines
  // Build layerIdx lookup for targets
  const nodeLayerIdx = {};
  LAYERS.layers.forEach((lay, li) => { lay.nodes.forEach(n => { nodeLayerIdx[n.name] = li; }); });

  LAYERS.edges.forEach(e => {
    const sp = pos[e.source];
    const tp = pos[e.target];
    const color = TYPE_COLOR[e.type] || C.subtext;

    if (e.type === 'use' || e.type === 'declare') {
      // Route through deduped input pill
      const li = nodeLayerIdx[e.target];
      if (li === undefined || !tp) return;
      let inpId = 'inp:' + e.source + '@' + li;
      let ip = pos[inpId];
      // If this input is a hidden child of a collapsed group, route through the group pill
      if (ip && ip._hidden) {
        const child = inputPillData[inpId];
        if (child && child._groupId) { inpId = child._groupId; ip = pos[inpId]; }
      }
      if (ip) {
        // Segment 1: source → input pill (only if source is in view)
        if (sp) {
          const seg1Key = e.source + '>' + inpId;
          if (!drawnSourceToInp.has(seg1Key)) {
            drawnSourceToInp.add(seg1Key);
            const d1 = bezier(sp, ip, true, true);
            const el1 = g.append("path")
              .attr("d", d1).attr("fill", "none").attr("stroke", color)
              .attr("stroke-opacity", 0.2).attr("stroke-width", 1.2)
              .attr("data-source", e.source).attr("data-target", e.target).attr("data-type", e.type)
              .attr("data-seg", "1").node();
            edgeEls.push(el1);
          }
        }
        // Segment 2: input pill → consumer result (always drawn)
        const d2 = bezier(ip, tp, true, true);
        const el2 = g.append("path")
          .attr("d", d2).attr("fill", "none").attr("stroke", color)
          .attr("stroke-opacity", 0.2).attr("stroke-width", 1.2)
          .attr("data-source", e.source).attr("data-target", e.target).attr("data-type", e.type)
          .attr("data-seg", "2").node();
        edgeEls.push(el2);
      } else if (sp && tp) {
        // Fallback direct
        const d = bezier(sp, tp, true, true);
        const el = g.append("path").attr("d", d).attr("fill", "none").attr("stroke", color)
          .attr("stroke-opacity", 0.2).attr("stroke-width", 1.2)
          .attr("data-source", e.source).attr("data-target", e.target).attr("data-type", e.type).node();
        edgeEls.push(el);
      }
    } else {
      if (!sp || !tp) return;
      // Direct connection: pull, axiom-ref
      const d = bezier(sp, tp, sp.depth !== tp.depth, sp.depth !== tp.depth);
      const el = g.append("path")
        .attr("d", d).attr("fill", "none").attr("stroke", color)
        .attr("stroke-opacity", e.type === 'axiom-ref' ? 0.35 : 0.2)
        .attr("stroke-width", 1.2)
        .attr("data-source", e.source).attr("data-target", e.target).attr("data-type", e.type)
        .node();
      edgeEls.push(el);
    }
  });

  // ── Draw input sub-pills ──
  Object.entries(inputPillData).forEach(([id, inp]) => {
    const p = pos[id];
    if (!p || p._hidden) return;  // skip hidden children of collapsed groups
    const stroke = TYPE_STROKE[inp.type] || C.surface2;
    const isDeclare = inp.type === 'declare';
    const isCollapsed = !!inp._isCollapsed;
    const isExpandHeader = !!inp._isExpandedHeader;

    const pg = g.append("g")
      .attr("transform", `translate(${p.x},${p.y})`)
      .attr("class", "cursor-pointer pill-node pill-input").attr("data-name", inp.label);

    pg.append("rect")
      .attr("width", p.w).attr("height", SUB_PH).attr("rx", 9)
      .attr("fill", (isCollapsed || isExpandHeader) ? C.base : (isDeclare ? C.base : C.pill))
      .attr("stroke", (isCollapsed || isExpandHeader) ? C.blue : stroke).attr("stroke-width", 1)
      .attr("stroke-dasharray", (isCollapsed || isExpandHeader) ? '4,2' : (isDeclare ? '3,2' : 'none'));

    const short = inp.label.includes('.') ? inp.label.split('.').slice(1).join('.') : inp.label;
    const maxCh = Math.floor((p.w - 16) / 5.2);
    pg.append("text")
      .attr("x", 8).attr("y", SUB_PH / 2 + 1).attr("dominant-baseline", "middle")
      .attr("fill", (isCollapsed || isExpandHeader) ? C.blue : stroke).attr("font-size", "8.5px")
      .text((isCollapsed ? short : isExpandHeader ? short : (inp.type === 'use' ? ':use ' + short : ':' + short)).slice(0, maxCh));

    if (isCollapsed) {
      pg.on("mouseover", (ev) => {
        const children = inp._children.map(c => c.label).join('\n');
        tooltip.html(`<b>${inp._prefix}.*</b> (${inp._children.length} items)\n${children}`)
          .classed("hidden", false)
          .style("left", (ev.pageX + 12) + "px").style("top", (ev.pageY - 8) + "px");
      }).on("mouseout", () => { tooltip.classed("hidden", true); });
    } else if (!isExpandHeader) {
      pg.on("mouseover", (ev) => {
        tooltip.html(`<b>:${inp.label}</b>\ntype: ${inp.type}\nconsumers: ${(inp.consumers||[inp.consumer]).join(', ')}`)
          .classed("hidden", false)
          .style("left", (ev.pageX + 12) + "px").style("top", (ev.pageY - 8) + "px");
      }).on("mouseout", () => { tooltip.classed("hidden", true); });
    }
    pg.on("click", (ev) => {
      ev.stopPropagation();
      if (isCollapsed || isExpandHeader) {
        // Toggle expand/collapse
        const prefix = inp._prefix;
        if (_expandedPrefixes.has(prefix)) _expandedPrefixes.delete(prefix);
        else _expandedPrefixes.add(prefix);
        // Full re-render (state is module-level, restored automatically)
        layersInitialized = false;
        document.getElementById('layers-svg').innerHTML = '';
        renderLayers();
      } else {
        selectNode(inp.label);
      }
    });
    if (!isCollapsed && !isExpandHeader) {
      pg.on("contextmenu", (ev) => { ev.preventDefault(); ev.stopPropagation(); showFocusPopup(ev, inp.label); });
      bindLongPress(pg, () => inp.label);
    }
  });

  // ── Draw result pills ──
  Object.entries(pos).forEach(([name, p]) => {
    if (p.isInput) return;
    const n = nodeData[name];
    if (!n) return;

    const pg = g.append("g")
      .attr("transform", `translate(${p.x},${p.y})`)
      .attr("class", "cursor-pointer pill-node pill-result").attr("data-name", name);

    pg.append("rect")
      .attr("width", p.w).attr("height", PH).attr("rx", 14)
      .attr("fill", C.surface0).attr("stroke", _pillStroke(name, n.kind)).attr("stroke-width", 1.5);
    pg.append("circle")
      .attr("cx", 12).attr("cy", PH / 2).attr("r", 4).attr("fill", kindDot(n.kind));

    const short = name.includes('.') ? name.split('.').slice(1).join('.') : name;
    const valS = n.value ? ` =${String(n.value).slice(0,15)}` : '';
    const maxCh = Math.floor((p.w - 28) / 6);
    pg.append("text")
      .attr("x", 22).attr("y", PH / 2 + 1).attr("dominant-baseline", "middle")
      .attr("fill", _pillTextFill(name, n.kind)).attr("font-size", "10px")
      .text((short + valS).slice(0, maxCh));

    pg.on("mouseover", (ev) => {
      let html = `<b>${name}</b>\nkind: ${n.kind}`;
      if (n.value) html += `\nvalue: ${String(n.value).slice(0,100)}`;
      if (n.uses && n.uses.length) html += `\nuses: ${n.uses.join(', ')}`;
      if (n.declares && n.declares.length) html += `\ndeclares: ${n.declares.join(', ')}`;
      if (n.pulls && n.pulls.length) html += `\npulls: ${n.pulls.join(', ')}`;
      const downs = childrenOf[name] || [];
      if (downs.length) html += `\ndownstream: ${downs.join(', ')}`;
      tooltip.html(html).classed("hidden", false)
        .style("left", (ev.pageX + 12) + "px").style("top", (ev.pageY - 8) + "px");
    }).on("mouseout", () => { tooltip.classed("hidden", true); });
    pg.on("click", (ev) => {
      ev.stopPropagation();
      selectNode(name);
    });
    pg.on("contextmenu", (ev) => { ev.preventDefault(); ev.stopPropagation(); showFocusPopup(ev, name); });
    bindLongPress(pg, () => name);
  });

  // ── Hanging section: disconnected L0 nodes ──
  if (hangingNodes.length > 0) {
    // Find max Y from all positioned elements to place hanging below
    let maxY = 0;
    Object.values(pos).forEach(p => { maxY = Math.max(maxY, p.y + p.h); });
    const hangY = maxY + 40;

    g.append("text")
      .attr("x", PAD).attr("y", hangY)
      .attr("fill", C.surface2).attr("font-size", "11px").attr("font-weight", "bold")
      .attr("class", "layer-label")
      .text(`Hanging (${hangingNodes.length})`);
    g.append("line")
      .attr("x1", PAD).attr("y1", hangY + 4)
      .attr("x2", PAD + 200).attr("y2", hangY + 4)
      .attr("stroke", C.surface2).attr("stroke-width", 0.5)
      .attr("class", "layer-label");

    const hangSet = new Set(hangingNodes.map(n => n.name));
    const HANG_W = 180;

    // Collect internal edges among hanging nodes
    const hangEdges = [];
    const hangFwd = {};
    const hangInDeg = {};
    hangingNodes.forEach(n => { hangInDeg[n.name] = 0; });
    LAYERS.edges.forEach(e => {
      if (hangSet.has(e.source) && hangSet.has(e.target)) {
        hangEdges.push(e);
        if (!hangFwd[e.source]) hangFwd[e.source] = [];
        hangFwd[e.source].push(e.target);
        hangInDeg[e.target] = (hangInDeg[e.target] || 0) + 1;
      }
    });

    // Topological layers for DAG layout
    const hangLayers = [];
    const hangAssigned = new Set();
    // Start with roots (in-degree 0)
    let frontier = hangingNodes.filter(n => (hangInDeg[n.name] || 0) === 0).map(n => n.name);
    while (frontier.length) {
      hangLayers.push(frontier);
      frontier.forEach(n => hangAssigned.add(n));
      const next = new Set();
      frontier.forEach(n => {
        (hangFwd[n] || []).forEach(t => {
          if (!hangAssigned.has(t)) next.add(t);
        });
      });
      // Only include nodes whose ALL parents are assigned
      frontier = [...next].filter(n => {
        const parents = LAYERS.edges.filter(e => e.target === n && hangSet.has(e.source)).map(e => e.source);
        return parents.every(p => hangAssigned.has(p));
      });
      if (frontier.length === 0 && hangAssigned.size < hangingNodes.length) {
        // Remaining unassigned (cycles) — dump them
        const remaining = hangingNodes.filter(n => !hangAssigned.has(n.name)).map(n => n.name);
        hangLayers.push(remaining);
        remaining.forEach(n => hangAssigned.add(n));
      }
    }

    // Layout hanging nodes in LTR columns per topo layer
    const hangNodeMap = {};
    hangingNodes.forEach(n => { hangNodeMap[n.name] = n; });

    let hx = PAD;
    hangLayers.forEach(layer => {
      let hy = hangY + 14;
      // Measure col width
      let colW = HANG_W;
      layer.forEach(name => {
        const short = name.includes('.') ? name.split('.').slice(1).join('.') : name;
        colW = Math.max(colW, Math.min(220, short.length * 6.5 + 28));
      });

      layer.forEach(name => {
        const n = hangNodeMap[name];
        if (!n) return;
        nodeData[n.name] = n;
        pos[n.name] = { x: hx, y: hy, w: colW, h: PH, depth: 0, hanging: true };

        const pg = g.append("g")
          .attr("transform", `translate(${hx},${hy})`)
          .attr("class", "cursor-pointer pill-node pill-result").attr("data-name", n.name);
        pg.append("rect")
          .attr("width", colW).attr("height", PH).attr("rx", 14)
          .attr("fill", C.base).attr("stroke", C.surface2).attr("stroke-width", 1)
          .attr("stroke-dasharray", "4,2");
        pg.append("circle")
          .attr("cx", 12).attr("cy", PH / 2).attr("r", 4).attr("fill", kindDot(n.kind));
        const short = n.name.includes('.') ? n.name.split('.').slice(1).join('.') : n.name;
        pg.append("text")
          .attr("x", 22).attr("y", PH / 2 + 1).attr("dominant-baseline", "middle")
          .attr("fill", C.surface2).attr("font-size", "10px")
          .text(short.slice(0, Math.floor((colW - 28) / 6)));
        pg.on("mouseover", (ev) => {
          tooltip.html(`<b>${n.name}</b>\nkind: ${n.kind}\n(hanging)`)
            .classed("hidden", false)
            .style("left", (ev.pageX + 12) + "px").style("top", (ev.pageY - 8) + "px");
        }).on("mouseout", () => { tooltip.classed("hidden", true); });
        pg.on("click", (ev) => {
          ev.stopPropagation();
          const d = ITEM_BY_ID[n.name];
          if (d) showDetail(d);
        });
        hy += PH + GAP_Y;
      });
      hx += colW + 30;
    });

    // Draw internal edges among hanging nodes
    hangEdges.forEach(e => {
      const sp = pos[e.source];
      const tp = pos[e.target];
      if (!sp || !tp) return;
      const color = TYPE_COLOR[e.type] || C.surface2;
      const sameCol = sp.x === tp.x;
      const d = sameCol
        ? bezier(sp, tp, false, false)
        : bezier(sp, tp, true, true);
      g.append("path")
        .attr("d", d).attr("fill", "none").attr("stroke", color)
        .attr("stroke-opacity", 0.3).attr("stroke-width", 1)
        .attr("stroke-dasharray", "4,2");
    });
  }

  // ── Focus stack + controls ──
  const btnBack = document.getElementById('btn-back');
  const btnUnfocus = document.getElementById('btn-unfocus');
  const focusPopup = document.getElementById('focus-popup');
  const focusPopupBtn = document.getElementById('focus-popup-btn');
  const focusStack = _focusStack;  // alias to module-level stack
  let _popupTarget = null;

  function syncFocusButtons() {
    if (focusStack.length > 0) {
      btnBack.classList.remove("hidden");
      btnUnfocus.classList.remove("hidden");
      btnBack.textContent = focusStack.length > 1 ? `\u2190 Back (${focusStack.length})` : '\u2190 Back';
    } else {
      btnBack.classList.add("hidden");
      btnUnfocus.classList.add("hidden");
    }
  }

  function showFocusPopup(ev, id) {
    _popupTarget = id;
    focusPopup.style.left = (ev.pageX + 8) + 'px';
    focusPopup.style.top = (ev.pageY - 4) + 'px';
    focusPopup.classList.remove("hidden");
  }

  // Long-press → focus popup (touch devices where contextmenu doesn't fire)
  const LONG_PRESS_MS = 500;
  function bindLongPress(sel, idFn) {
    let _timer = null;
    let _startXY = null;
    sel.on("touchstart.lp", function(ev) {
      const t = ev.touches[0];
      _startXY = { x: t.clientX, y: t.clientY };
      _timer = setTimeout(() => {
        ev.preventDefault();
        // Synthesize pageX/pageY for showFocusPopup
        showFocusPopup({ pageX: t.pageX, pageY: t.pageY }, idFn(this, ev));
      }, LONG_PRESS_MS);
    }, { passive: false });
    sel.on("touchmove.lp", function(ev) {
      if (!_timer) return;
      const t = ev.touches[0];
      if (Math.abs(t.clientX - _startXY.x) > 10 || Math.abs(t.clientY - _startXY.y) > 10) {
        clearTimeout(_timer); _timer = null;
      }
    });
    sel.on("touchend.lp touchcancel.lp", function() { if (_timer) { clearTimeout(_timer); _timer = null; } });
  }

  function hideFocusPopup() {
    focusPopup.classList.add("hidden");
    _popupTarget = null;
  }

  focusPopupBtn.onclick = () => {
    if (!_popupTarget) return;
    const id = _popupTarget;
    hideFocusPopup();
    pushFocus(id);
  };

  // Dismiss popup on click elsewhere
  document.addEventListener('click', (ev) => {
    if (!focusPopup.contains(ev.target)) hideFocusPopup();
  });

  function pushFocus(id) {
    const path = collectPath(id);
    focusStack.push({path, focusId: id});
    rebuildFocused(path, id);
    syncFocusButtons();
    const d = ITEM_BY_ID[id];
    if (d) { info.innerHTML = _infoHtml(d, path); info.classList.remove("hidden"); showDetail(d); }
  }

  btnBack.onclick = () => {
    if (focusStack.length <= 1) { unfocusAll(); return; }
    focusStack.pop();
    const prev = focusStack[focusStack.length - 1];
    rebuildFocused(prev.path, prev.focusId);
    syncFocusButtons();
    if (_taintsOn) applyFocusTaints();
    const d = ITEM_BY_ID[prev.focusId];
    if (d) { info.innerHTML = _infoHtml(d, prev.path); info.classList.remove("hidden"); showDetail(d); }
  };

  btnUnfocus.onclick = () => unfocusAll();
  svg.on("click", () => { hideFocusPopup(); if (!focusStack.length) unfocusAll(); });

  // ── Taint propagation (visual) ──
  const btnTaints = document.getElementById('btn-taints');

  function applyTaints() {
    const tainted = computeTainted();
    g.selectAll(".pill-result").each(function() {
      const el = d3.select(this);
      const name = el.attr("data-name");
      if (tainted.has(name)) {
        const isSource = taintSources.has(name);
        el.select("rect")
          .attr("stroke", isSource ? C.red : C.yellow)
          .attr("stroke-width", isSource ? 2.5 : 2)
          .attr("stroke-dasharray", isSource ? "none" : "6,2");
      }
    });
    g.selectAll(".pill-input").each(function() {
      const el = d3.select(this);
      const name = el.attr("data-name");
      if (tainted.has(name)) {
        el.select("rect").attr("stroke", C.yellow).attr("stroke-width", 1.5);
      }
    });
    edgeEls.forEach(el => {
      const s = el.getAttribute("data-source");
      const t = el.getAttribute("data-target");
      if (tainted.has(s) && tainted.has(t)) {
        el.setAttribute("stroke", C.yellow);
        el.setAttribute("stroke-opacity", "0.5");
        el.setAttribute("stroke-width", "1.8");
      }
    });
    // Show count
    info.innerHTML = `<div class="font-bold text-red mb-1">Taint analysis</div>`
      + `<div><span class="text-overlay0">sources:</span> <span class="text-red">${taintSources.size}</span> unverified</div>`
      + `<div><span class="text-overlay0">tainted:</span> <span class="text-yellow">${tainted.size}</span> total</div>`
      + `<div class="mt-1 text-[10px] text-overlay0">Red = unverified source, Yellow = tainted downstream</div>`;
    info.classList.remove("hidden");
  }

  function clearTaints() {
    g.selectAll(".pill-result").each(function() {
      const el = d3.select(this);
      const name = el.attr("data-name");
      const n = nodeData[name];
      const p = pos[name];
      if (n && p && !p.hanging) {
        el.select("rect").attr("stroke", _pillStroke(name, n.kind)).attr("stroke-width", 1.5).attr("stroke-dasharray", "none");
      } else if (p && p.hanging) {
        el.select("rect").attr("stroke", C.surface2).attr("stroke-width", 1).attr("stroke-dasharray", "4,2");
      }
    });
    g.selectAll(".pill-input").each(function() {
      const el = d3.select(this);
      el.select("rect").attr("stroke", C.green).attr("stroke-width", 1);
    });
    edgeEls.forEach(el => {
      const t = el.getAttribute("data-type");
      el.setAttribute("stroke", TYPE_COLOR[t] || C.subtext);
      el.setAttribute("stroke-opacity", t === 'axiom-ref' ? "0.35" : "0.2");
      el.setAttribute("stroke-width", "1.2");
    });
    info.classList.add("hidden");
  }

  function applyFocusTaints() {
    if (!focusG) return;
    const tainted = computeTainted();
    focusG.selectAll(".fpill-result").each(function() {
      const el = d3.select(this);
      const name = el.attr("data-name");
      if (tainted.has(name)) {
        const isSource = taintSources.has(name);
        el.select("rect")
          .attr("stroke", isSource ? C.red : C.yellow)
          .attr("stroke-width", isSource ? 2.5 : 2)
          .attr("stroke-dasharray", isSource ? "none" : "6,2");
      }
    });
    focusG.selectAll(".fpill-input").each(function() {
      const el = d3.select(this);
      const name = el.attr("data-name");
      if (tainted.has(name)) {
        el.select("rect").attr("stroke", C.yellow).attr("stroke-width", 1.5);
      }
    });
  }

  function clearFocusTaints() {
    if (!focusG) return;
    focusG.selectAll(".fpill-result").each(function() {
      const el = d3.select(this);
      const name = el.attr("data-name");
      const n = nodeData[name];
      el.select("rect").attr("stroke", n ? _pillStroke(name, n.kind) : kindDot('')).attr("stroke-width", 1.5).attr("stroke-dasharray", "none");
    });
    focusG.selectAll(".fpill-input").each(function() {
      const el = d3.select(this);
      el.select("rect").attr("stroke", TYPE_STROKE[el.attr("data-type")] || C.surface2).attr("stroke-width", 1);
    });
  }

  btnTaints.onclick = () => {
    _taintsOn = !_taintsOn;
    btnTaints.textContent = _taintsOn ? 'Taints ON' : 'Taints';
    btnTaints.className = _taintsOn
      ? 'px-3 py-1 rounded-lg text-xs bg-red text-crust font-bold border border-red'
      : 'px-3 py-1 rounded-lg text-xs bg-surface0 text-subtext border border-surface2 hover:bg-surface1';
    if (_taintsOn) { applyTaints(); applyFocusTaints(); }
    else { clearTaints(); clearFocusTaints(); }
  };

  // ── Taint Focus — rebuild layout with only tainted nodes ──
  const btnTaintFocus = document.getElementById('btn-taint-focus');
  btnTaintFocus.onclick = () => {
    _taintFocusOn = !_taintFocusOn;
    btnTaintFocus.textContent = _taintFocusOn ? 'Taint Focus ON' : 'Taint Focus';
    btnTaintFocus.className = _taintFocusOn
      ? 'px-3 py-1 rounded-lg text-xs bg-red text-crust font-bold border border-red'
      : 'px-3 py-1 rounded-lg text-xs bg-surface0 text-subtext border border-surface2 hover:bg-surface1';
    if (_taintFocusOn) {
      const tainted = computeTainted();
      focusedId = null;
      focusStack.push({path: tainted, focusId: null});
      syncFocusButtons();
      rebuildFocused(tainted, null);
      // Apply taint colors on the focused view
      if (focusG) {
        focusG.selectAll(".fpill-result").each(function() {
          const el = d3.select(this);
          const name = el.attr("data-name");
          const isSource = taintSources.has(name);
          el.select("rect")
            .attr("stroke", isSource ? C.red : C.yellow)
            .attr("stroke-width", isSource ? 2.5 : 2)
            .attr("stroke-dasharray", isSource ? "none" : "6,2");
        });
        focusG.selectAll(".fpill-input").each(function() {
          const el = d3.select(this);
          const name = el.attr("data-name");
          if (tainted.has(name)) {
            el.select("rect").attr("stroke", C.yellow).attr("stroke-width", 1.5);
          }
        });
      }
      info.innerHTML = `<div class="font-bold text-red mb-1">Taint Focus</div>`
        + `<div><span class="text-overlay0">sources:</span> <span class="text-red">${taintSources.size}</span> unverified</div>`
        + `<div><span class="text-overlay0">tainted:</span> <span class="text-yellow">${tainted.size}</span> total</div>`
        + `<div class="mt-1 text-[10px] text-overlay0">Showing only tainted nodes and their connections</div>`;
      info.classList.remove("hidden");
    } else {
      unfocusAll();
    }
  };

  // Select node: dim non-path, highlight path, show detail (never rebuilds layout)
  function selectNode(id) {
    focusedId = id;
    const path = collectPath(id);

    // ── Dim mode: dim non-path, highlight path ──
    g.selectAll(".pill-node").each(function() {
      const el = d3.select(this);
      const name = el.attr("data-name");
      if (path.has(name)) {
        el.attr("opacity", 1);
        if (name === id) el.select("rect").attr("stroke", C.mauve).attr("stroke-width", 3);
        else el.select("rect").attr("stroke-width", el.classed("pill-input") ? 1 : 1.5);
      } else {
        el.attr("opacity", 0.18);
      }
    });

    edgeEls.forEach(el => {
      const s = el.getAttribute("data-source");
      const t = el.getAttribute("data-target");
      if (path.has(s) && path.has(t)) {
        el.setAttribute("stroke-opacity", "0.8");
        el.setAttribute("stroke-width", "2");
      } else {
        el.setAttribute("stroke-opacity", "0.03");
        el.setAttribute("stroke-width", "1");
      }
    });

    g.selectAll(".layer-label").each(function() {
      const el = d3.select(this);
      // Keep stats widgets visible, dim everything else
      const cls = el.attr("class") || '';
      if (cls.includes('stats-widget-')) {
        el.attr("opacity", 1);
      } else {
        el.attr("opacity", 0.15);
      }
    });
    // Recompute stats filtered to selection path
    recomputeAllStats(path);

    const d = ITEM_BY_ID[id];
    if (d) {
      info.innerHTML = _infoHtml(d, path);
      info.classList.remove("hidden");
      showDetail(d);
    }
  }

  // ── Rebuild SVG with only focused path nodes (rails-but-pills layout) ──
  let focusG = null;
  function rebuildFocused(path, focusId) {
    g.selectAll("*").style("display", "none");
    if (focusG) focusG.remove();
    focusG = svg.append("g");
    svg.call(zoomBehavior);
    zoomBehavior.on("zoom", (e) => focusG.attr("transform", e.transform));

    // Filter layers to path nodes
    const fLayers = [];
    LAYERS.layers.forEach(lay => {
      const fnodes = lay.nodes.filter(n => path.has(n.name));
      if (fnodes.length) fLayers.push({ depth: lay.depth, nodes: fnodes });
    });

    const fPos = {};
    const fInputPills = {};
    const fNodeLayerIdx = {};
    let fX = PAD;

    fLayers.forEach((lay, li) => {
      lay.nodes.forEach(n => { fNodeLayerIdx[n.name] = li; });

      // Deduped input pills for this layer (uses + declares)
      const useSeen = {};
      const rawInputs = [];
      lay.nodes.forEach(n => {
        (n.uses || []).forEach(u => {
          if (path.has(u) || path.has(n.name)) {
            if (!useSeen[u]) {
              useSeen[u] = {id: 'inp:'+u+'@'+li, label: u, consumers: [], type: 'use'};
              rawInputs.push(useSeen[u]);
            }
            useSeen[u].consumers.push(n.name);
          }
        });
        (n.declares || []).forEach(d => {
          if (path.has(d) || path.has(n.name)) {
            if (!useSeen[d]) {
              useSeen[d] = {id: 'inp:'+d+'@'+li, label: d, consumers: [], type: 'declare'};
              rawInputs.push(useSeen[d]);
            }
            useSeen[d].consumers.push(n.name);
          }
        });
      });
      // Prefix-collapse: same shared logic, but skip taint sources and focus target
      const mustShowFn = (inp) => inp.label === focusId || taintSources.has(inp.label);
      const {assignment: fInpAssignment, members: fPrefixMembers} = _computePrefixGroups(rawInputs, li, mustShowFn);
      const {collapsed: layerInputs, groups: fCollapsedSeen, ungrouped: fUngrouped} = _buildCollapsedInputs(rawInputs, fInpAssignment, fPrefixMembers);
      layerInputs.forEach(p => { fInputPills[p.id] = p; });
      // Register hidden children for edge routing (only collapsed pills have _children)
      Object.values(fCollapsedSeen).forEach(cpill => {
        if (cpill._children) cpill._children.forEach(ch => { fInputPills[ch.id] = ch; ch._groupId = cpill.id; });
      });
      const hasInputs = layerInputs.length > 0;

      // Measure widths
      let inputColW = 0;
      if (hasInputs) layerInputs.forEach(inp => {
        const short = inp.label.includes('.') ? inp.label.split('.').slice(1).join('.') : inp.label;
        inp._w = Math.min(SPW_MAX, Math.max(SPW_MIN, short.length * 5.5 + 20));
        inputColW = Math.max(inputColW, inp._w);
      });
      let resultColW = 0;
      lay.nodes.forEach(n => {
        const short = n.name.includes('.') ? n.name.split('.').slice(1).join('.') : n.name;
        n._fw = Math.min(PW_MAX, Math.max(PW_MIN, (short + (n.value ? ' =' + String(n.value).slice(0,15) : '')).length * 6.5 + 28));
        resultColW = Math.max(resultColW, n._fw);
      });

      const inputXf = fX;
      const resultXf = hasInputs ? fX + inputColW + GAP_XI : fX;
      const fColW = resultXf + resultColW - fX;
      const fCx = fX + fColW / 2;
      const labelY = PAD + LABEL_H - 4;

      // "inputs" label
      if (hasInputs) {
        focusG.append("text")
          .attr("x", inputXf + inputColW / 2).attr("y", labelY)
          .attr("text-anchor", "middle")
          .attr("fill", C.green).attr("font-size", "8px").attr("font-style", "italic")
          .text("inputs");
      }

      // L label
      focusG.append("text")
        .attr("x", fCx).attr("y", labelY)
        .attr("text-anchor", "middle")
        .attr("fill", C.overlay0).attr("font-size", "10px").attr("font-weight", "bold")
        .text(`L${lay.depth} (${lay.nodes.length})`);

      // Stats widget
      const wx = fCx + 36;
      const stats = computeLayerStats(lay, path);
      drawStats(focusG, lay, stats, wx, labelY);

      // Stack input pills
      let inputY = PAD + LABEL_H + HEADER_GAP;
      layerInputs.forEach(inp => {
        fPos[inp.id] = { x: inputXf, y: inputY, w: inp._w, h: SUB_PH, isInput: true, type: inp.type };
        // Position hidden children at same spot for edge routing
        if (inp._isCollapsed && inp._children) {
          inp._children.forEach(ch => {
            fPos[ch.id] = { x: inputXf, y: inputY, w: inp._w, h: SUB_PH, isInput: true, type: ch.type, _hidden: true };
          });
        }
        inputY += SUB_PH + SUB_GAP_Y;
      });
      // Stack result pills
      let resultY = PAD + LABEL_H + HEADER_GAP;
      lay.nodes.forEach(n => {
        fPos[n.name] = { x: resultXf, y: resultY, w: n._fw, h: PH };
        resultY += PH + GAP_Y;
      });
      fX = resultXf + resultColW + GAP_X;
    });

    // Draw focused edges
    const fDrawnSrcInp = new Set();
    LAYERS.edges.forEach(e => {
      const sp = fPos[e.source];
      const tp = fPos[e.target];
      const color = TYPE_COLOR[e.type] || C.subtext;

      if (e.type === 'use' || e.type === 'declare') {
        const li = fNodeLayerIdx[e.target];
        if (li === undefined || !tp) return;
        let inpId = 'inp:' + e.source + '@' + li;
        let ip = fPos[inpId];
        // If hidden child of collapsed group, route through group pill
        if (!ip) {
          const child = fInputPills[inpId];
          if (child && child._groupId) { inpId = child._groupId; ip = fPos[inpId]; }
        }
        if (ip) {
          if (sp) {
            const seg1Key = e.source + '>' + inpId;
            if (!fDrawnSrcInp.has(seg1Key)) {
              fDrawnSrcInp.add(seg1Key);
              focusG.append("path").attr("d", bezier(sp, ip, true, true))
                .attr("fill", "none").attr("stroke", color).attr("stroke-opacity", 0.6).attr("stroke-width", 1.8);
            }
          }
          focusG.append("path").attr("d", bezier(ip, tp, true, true))
            .attr("fill", "none").attr("stroke", color).attr("stroke-opacity", 0.6).attr("stroke-width", 1.8);
        } else if (sp && tp) {
          focusG.append("path").attr("d", bezier(sp, tp, true, true))
            .attr("fill", "none").attr("stroke", color).attr("stroke-opacity", 0.6).attr("stroke-width", 1.8);
        }
      } else {
        if (!sp || !tp) return;
        focusG.append("path").attr("d", bezier(sp, tp, true, true))
          .attr("fill", "none").attr("stroke", color)
          .attr("stroke-opacity", e.type === 'axiom-ref' ? 0.5 : 0.6).attr("stroke-width", 1.8);
      }
    });

    // Draw focused input pills (including collapsed groups + expand headers)
    Object.entries(fInputPills).forEach(([id, inp]) => {
      const p = fPos[id];
      if (!p || p._hidden) return;
      const isCollapsed = !!inp._isCollapsed;
      const isExpandHeader = !!inp._isExpandedHeader;
      const stroke = (isCollapsed || isExpandHeader) ? C.blue : (TYPE_STROKE[inp.type] || C.surface2);
      const pg = focusG.append("g").attr("transform", `translate(${p.x},${p.y})`)
        .attr("class", "cursor-pointer fpill-input").attr("data-name", inp.label);
      pg.append("rect").attr("width", p.w).attr("height", SUB_PH).attr("rx", 9)
        .attr("fill", (isCollapsed || isExpandHeader) ? C.base : C.pill)
        .attr("stroke", stroke).attr("stroke-width", 1)
        .attr("stroke-dasharray", (isCollapsed || isExpandHeader) ? '4,2' : 'none');
      const short = inp.label.includes('.') ? inp.label.split('.').slice(1).join('.') : inp.label;
      pg.append("text").attr("x", 8).attr("y", SUB_PH / 2 + 1).attr("dominant-baseline", "middle")
        .attr("fill", stroke).attr("font-size", "8.5px")
        .text(((isCollapsed || isExpandHeader) ? short : (inp.type === 'use' ? ':use ' + short : ':' + short)).slice(0, Math.floor((p.w - 16) / 5.2)));
      if (isCollapsed) {
        pg.on("mouseover", (ev) => {
          const children = inp._children.map(c => c.label).join('\n');
          tooltip.html(`<b>${inp._prefix}.*</b> (${inp._children.length} items)\n${children}`)
            .classed("hidden", false)
            .style("left", (ev.pageX + 12) + "px").style("top", (ev.pageY - 8) + "px");
        }).on("mouseout", () => { tooltip.classed("hidden", true); });
        pg.on("click", (ev) => {
          ev.stopPropagation();
          _expandedPrefixes.add(inp._prefix);
          // Re-render focused view with current stack top
          const cur = focusStack[focusStack.length - 1];
          if (cur) rebuildFocused(cur.path, cur.focusId);
        });
      } else if (isExpandHeader) {
        pg.on("click", (ev) => {
          ev.stopPropagation();
          _expandedPrefixes.delete(inp._prefix);
          const cur = focusStack[focusStack.length - 1];
          if (cur) rebuildFocused(cur.path, cur.focusId);
        });
      } else {
        pg.on("click", (ev) => {
          ev.stopPropagation();
          const d = ITEM_BY_ID[inp.label];
          if (d) showDetail(d);
        });
        pg.on("contextmenu", (ev) => { ev.preventDefault(); ev.stopPropagation(); showFocusPopup(ev, inp.label); });
        bindLongPress(pg, () => inp.label);
      }
    });

    // Draw focused result pills
    fLayers.forEach(lay => lay.nodes.forEach(n => {
      const p = fPos[n.name];
      if (!p || p.isInput) return;
      const isFocused = n.name === focusId;
      const pg = focusG.append("g").attr("transform", `translate(${p.x},${p.y})`).attr("class", "cursor-pointer fpill-result").attr("data-name", n.name);
      pg.append("rect").attr("width", p.w).attr("height", PH).attr("rx", 14)
        .attr("fill", isFocused ? C.surface1 : C.surface0)
        .attr("stroke", isFocused ? C.mauve : _pillStroke(n.name, n.kind))
        .attr("stroke-width", isFocused ? 3 : 1.5);
      pg.append("circle").attr("cx", 12).attr("cy", PH / 2).attr("r", 4).attr("fill", kindDot(n.kind));
      const short = n.name.includes('.') ? n.name.split('.').slice(1).join('.') : n.name;
      const maxCh = Math.floor((p.w - 28) / 6);
      pg.append("text").attr("x", 22).attr("y", PH / 2 + 1).attr("dominant-baseline", "middle")
        .attr("fill", _pillTextFill(n.name, n.kind)).attr("font-size", "10px")
        .text((short + (n.value ? ' =' + String(n.value).slice(0,15) : '')).slice(0, maxCh));
      pg.on("click", (ev) => {
        ev.stopPropagation();
        const d = ITEM_BY_ID[n.name];
        if (d) showDetail(d);
      });
      pg.on("contextmenu", (ev) => { ev.preventDefault(); ev.stopPropagation(); showFocusPopup(ev, n.name); });
      bindLongPress(pg, () => n.name);
      pg.on("mouseover", (ev) => {
        tooltip.html(`<b>${n.name}</b>\n${n.kind}${n.value ? '\n' + String(n.value).slice(0,80) : ''}`)
          .classed("hidden", false)
          .style("left", (ev.pageX + 12) + "px").style("top", (ev.pageY - 8) + "px");
      }).on("mouseout", () => tooltip.classed("hidden", true));
    }));

    // Apply taints if active
    if (_taintsOn) applyFocusTaints();

    // Info + zoom to fit
    const d = ITEM_BY_ID[focusId];
    if (d) { info.innerHTML = _infoHtml(d, path); info.classList.remove("hidden"); showDetail(d); }
    requestAnimationFrame(() => {
      const bounds = focusG.node().getBBox();
      if (bounds.width > 0) {
        const scale = Math.min(W / (bounds.width + 80), H / (bounds.height + 80), 2);
        const cx = bounds.x + bounds.width / 2, cy = bounds.y + bounds.height / 2;
        svg.transition().duration(300).call(
          zoomBehavior.transform,
          d3.zoomIdentity.translate(W/2 - cx*scale, H/2 - cy*scale).scale(scale)
        );
      }
    });
  }

  function unfocusAll() {
    focusedId = null;
    focusStack.length = 0;
    _taintFocusOn = false;
    btnTaintFocus.textContent = 'Taint Focus';
    btnTaintFocus.className = 'px-3 py-1 rounded-lg text-xs bg-surface0 text-subtext border border-surface2 hover:bg-surface1';
    syncFocusButtons();
    if (focusG) { focusG.remove(); focusG = null; }
    g.selectAll("*").style("display", null);
    zoomBehavior.on("zoom", (e) => g.attr("transform", e.transform));

    g.selectAll(".pill-result").attr("opacity", 1).each(function() {
      const el = d3.select(this);
      const name = el.attr("data-name");
      const n = nodeData[name];
      el.select("rect").attr("stroke-width", 1.5).attr("stroke", n ? _pillStroke(name, n.kind) : kindDot(''));
    });
    g.selectAll(".pill-input").attr("opacity", 1);
    edgeEls.forEach(el => {
      el.setAttribute("stroke-opacity", "0.2");
      el.setAttribute("stroke-width", "1.2");
    });
    g.selectAll(".layer-label").attr("opacity", 1);
    // Restore full stats (unfiltered)
    recomputeAllStats(null);
    info.classList.add("hidden");

    // Restore taints if active
    if (_taintsOn) applyTaints();

    requestAnimationFrame(() => {
      const bounds = g.node().getBBox();
      if (bounds.width > 0) {
        const scale = Math.min(W / (bounds.width + 80), H / (bounds.height + 80), 1);
        const tx = 40 - bounds.x * scale, ty = 20 - bounds.y * scale;
        svg.transition().duration(300).call(
          zoomBehavior.transform, d3.zoomIdentity.translate(tx, ty).scale(scale)
        );
      }
    });
  }

  function _infoHtml(d, path) {
    let html = `<div class="font-bold text-lavender mb-1">${esc(d.id)}</div>`;
    html += `<div><span class="text-overlay0">kind:</span> <span style="color:${kindDot(d.kind)}">${esc(d.kind)}</span></div>`;
    html += `<div><span class="text-overlay0">layer:</span> ${d.depth}</div>`;
    html += `<div><span class="text-overlay0">path:</span> ${path.size} nodes</div>`;
    const downs = childrenOf[d.id] || [];
    if (downs.length) html += `<div><span class="text-overlay0">downstream:</span> ${downs.length}</div>`;
    if (d.value) html += `<div class="mt-1 text-subtext truncate" style="max-width:250px">${esc(String(d.value).slice(0,80))}</div>`;
    return html;
  }

  // Initial zoom to fit
  requestAnimationFrame(() => {
    const bounds = g.node().getBBox();
    if (bounds.width > 0 && bounds.height > 0) {
      const scale = Math.min(W / (bounds.width + 80), H / (bounds.height + 80), 1);
      const tx = 40 - bounds.x * scale;
      const ty = 20 - bounds.y * scale;
      svg.call(zoomBehavior.transform, d3.zoomIdentity.translate(tx, ty).scale(scale));
    }
  });

  // ── Restore module-level state after re-render ──
  if (_focusStack.length) {
    const top = _focusStack[_focusStack.length - 1];
    rebuildFocused(top.path, top.focusId);
    syncFocusButtons();
    if (_taintFocusOn) {
      btnTaintFocus.textContent = 'Taint Focus ON';
      btnTaintFocus.className = 'px-3 py-1 rounded-lg text-xs bg-red text-crust font-bold border border-red';
      applyFocusTaints();
    }
  }
  if (_taintsOn) {
    btnTaints.textContent = 'Taints ON';
    btnTaints.className = 'px-3 py-1 rounded-lg text-xs bg-red text-crust font-bold border border-red';
    applyTaints();
    if (_focusStack.length) applyFocusTaints();
  }

  // ── External focus API ──
  window._layersFocusNode = function(name) {
    const pill = g.select(`.pill-node[data-name="${name}"]`);
    if (!pill.empty()) {
      selectNode(name);
      // Extract translate(x,y) from the pill's transform attribute (coords in g-space)
      const tAttr = pill.attr("transform") || '';
      const m = tAttr.match(/translate\(\s*([\d.e+-]+)\s*,\s*([\d.e+-]+)/);
      if (m) {
        const bbox = pill.node().getBBox();
        const cx = parseFloat(m[1]) + bbox.width / 2;
        const cy = parseFloat(m[2]) + bbox.height / 2;
        const scale = 1.5;
        const tx = W / 2 - cx * scale;
        const ty = H / 2 - cy * scale;
        svg.transition().duration(600).call(
          zoomBehavior.transform, d3.zoomIdentity.translate(tx, ty).scale(scale)
        );
      }
    }
  };
}


// -- Init --
renderSource();
</script>
