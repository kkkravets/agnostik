[project]
name = "agnostik"
version = "0.1.0"
description = "Hackathon workspace for defensible oncology target selection."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "clawbio==0.6.1",
    "parseltongue-dsl[llm]==0.7.4",
]

[project.scripts]
agnostik = "agnostik.cli:main"
agnostik-evidence = "agnostik.evidence_cli:main"
agnostik-parseltongue = "agnostik.parseltongue_cli:main"
agnostik-nebius-smoke = "agnostik.nebius_smoke:main"
agnostik-objections = "agnostik.objections.cli:main"
agnostik-citecheck = "agnostik.citecheck.cli:main"
agnostik-consistency = "agnostik.consistency.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pip>=26.2.1",
]
