[project]
name = "agnostik"
version = "0.1.0"
description = "Hackathon workspace for defensible oncology target selection."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "clawbio",
    "parseltongue-dsl[llm]==0.7.4",
]

[project.scripts]
agnostik = "agnostik.cli:main"
agnostik-collect-evidence = "agnostik.evidence_cli:main"
agnostik-evidence = "agnostik.evidence_cli:main"
agnostik-parseltongue = "agnostik.parseltongue_cli:main"
agnostik-nebius-smoke = "agnostik.nebius_smoke:main"
agnostik-objections = "agnostik.objections.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pip>=26.2.1",
]

[tool.uv.sources]
# Unreleased ClawBio (post-0.7.1) for the reworked pubmed-summariser; pinned to a commit for reproducibility.
clawbio = { git = "https://github.com/ClawBio/ClawBio", rev = "4848cc280c446093b1364a2445db3137d455cc17" }
